name: fixed-assets engine

on:
  push:
    paths:
      - "fixed-assets-saas/engine/**"
      - ".github/workflows/fixed-assets-engine.yml"
  pull_request:
    paths:
      - "fixed-assets-saas/engine/**"
      - ".github/workflows/fixed-assets-engine.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fixed-assets-saas/engine
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
