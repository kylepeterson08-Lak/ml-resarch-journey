<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AP Gov Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one reading column. The ruled index card is the only loud object; everything around it stays quiet.
     Type: Caslon (the face of the 1776 Declaration broadside) for display, Public Sans (the U.S. Web Design System face) for body. */
  --bg:#e7ebf0;
  --surface:#f7f9fb;
  --ink:#15203a;
  --muted:#56627a;
  --line:#c8d0dc;
  --accent:#1a4480;
  --accent-ink:#ffffff;
  --card:#fffef8;
  --card-ink:#18223d;
  --card-muted:#5b6479;
  --card-rule:#d4454f;
  --card-line:#c6dcef;
  --good:#0ca30c;
  --warn:#fab219;
  --bad:#d03b3b;
  --track:#d3dae4;
  --shadow:0 1px 0 rgba(21,32,58,.06), 0 18px 40px -22px rgba(21,32,58,.45);
  --font-display:"Libre Caslon Text","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1422; --surface:#151f33; --ink:#e6ebf3; --muted:#9da9be; --line:#2c3a55;
    --accent:#9fc0f7; --accent-ink:#0d1422;
    --card:#ebe8de; --card-ink:#18223d; --card-muted:#555e72; --card-rule:#c03f49; --card-line:#b3c9de;
    --track:#2c3a55; --shadow:0 1px 0 rgba(0,0,0,.3), 0 18px 40px -20px rgba(0,0,0,.75);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1422; --surface:#151f33; --ink:#e6ebf3; --muted:#9da9be; --line:#2c3a55;
  --accent:#9fc0f7; --accent-ink:#0d1422;
  --card:#ebe8de; --card-ink:#18223d; --card-muted:#555e72; --card-rule:#c03f49; --card-line:#b3c9de;
  --track:#2c3a55; --shadow:0 1px 0 rgba(0,0,0,.3), 0 18px 40px -20px rgba(0,0,0,.75);
  color-scheme:dark;
}
html[data-size="1"]{font-size:112.5%}
html[data-size="2"]{font-size:125%}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);font-weight:400;line-height:1.2;text-wrap:balance;margin:0}
h2{font-size:clamp(1.45rem,3.2vw,1.9rem)}
h3{font-size:1.2rem}
p{margin:0}
a{color:var(--accent)}
.wrap{max-width:52rem;margin:0 auto;padding-left:max(16px,1.25rem);padding-right:max(16px,1.25rem)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-999px}
.skip:focus{left:16px;top:8px;z-index:10;background:var(--surface);padding:.5rem .75rem;border-radius:6px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
kbd{font:600 .72rem var(--font-body);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:.05rem .35rem;background:var(--surface);color:var(--muted)}

/* Masthead */
.masthead{background:var(--surface);border-bottom:1px solid var(--line)}
.mast-inner{display:flex;flex-wrap:wrap;gap:.75rem 1rem;justify-content:space-between;align-items:flex-end;padding-top:1.2rem;padding-bottom:.6rem}
.kicker{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:.2rem}
h1{font-size:clamp(1.7rem,4vw,2.3rem)}
.prefs{display:flex;gap:.5rem;flex-wrap:wrap}
.ghost{font:500 .82rem var(--font-body);color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:.35rem .8rem;cursor:pointer;min-height:36px}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
.tabs{display:flex;gap:.25rem;overflow-x:auto}
.tabs a{padding:.65rem .85rem;color:var(--muted);text-decoration:none;font-weight:600;font-size:.95rem;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-top:1.25rem;padding-bottom:3rem}

/* Deck chips */
.deckbar{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{font:500 .85rem var(--font-body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:.35rem .75rem;cursor:pointer;min-height:36px;display:inline-flex;gap:.4rem;align-items:center}
.chip .count{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.78rem}
.chip:hover:not(:disabled){border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .count{color:inherit;opacity:.75}
.chip:disabled{opacity:.45;cursor:not-allowed}

/* Study header + mastery bar */
.studyhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.6rem 1.5rem;margin:1.1rem 0 .9rem}
.pos{font-weight:600}
.pos .muted{font-weight:400}
.mastery{display:flex;flex-direction:column;gap:.35rem;min-width:min(100%,17rem)}
.seg{display:flex;gap:2px;height:8px;border-radius:999px;overflow:hidden;background:transparent}
.seg span{display:block;height:100%}
.good-bg{background:var(--good)}
.warn-bg{background:var(--warn)}
.new-bg{background:var(--track)}
.legend{display:flex;flex-wrap:wrap;gap:.25rem .9rem;list-style:none;margin:0;padding:0;font-size:.8rem;color:var(--muted)}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.dot{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;margin-right:.35rem}

/* The index card */
.scene{perspective:1800px}
.card{position:relative;border-radius:8px;cursor:pointer;outline-offset:6px}
.card-inner{display:grid;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.75,.25,1)}
.card.flipped .card-inner{transform:rotateY(180deg)}
.card.no-anim .card-inner{transition:none}
html[data-motion="off"] .card-inner{transition:none}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);color:var(--card-ink);border-radius:8px;box-shadow:var(--shadow);padding:1rem 1.6rem 1.1rem;min-height:21rem;display:flex;flex-direction:column}
.back{transform:rotateY(180deg)}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding-bottom:.55rem;border-bottom:2px solid var(--card-rule);font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;color:var(--card-muted);font-weight:600}
.cardno{letter-spacing:.03em;white-space:nowrap}
.ruled{flex:1;display:flex;align-items:center;padding:1.25rem 0;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(2.25rem - 1px),var(--card-line) calc(2.25rem - 1px),var(--card-line) 2.25rem)}
.term{font-family:var(--font-display);font-size:clamp(1.8rem,5vw,2.75rem);line-height:1.18;text-wrap:balance;max-width:20ch}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding-top:.6rem;font-size:.8rem;color:var(--card-muted)}
.badge{display:inline-flex;align-items:center;gap:.4rem;font-weight:600;font-size:.74rem;letter-spacing:.02em;padding:.2rem .55rem;border-radius:4px;border:1px solid var(--card-muted);color:var(--card-ink)}
.badge.new::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:var(--card-rule)}
.back-term{font-family:var(--font-display);font-size:1.05rem;text-transform:none;letter-spacing:0;color:var(--card-ink);font-weight:400}
.def{font-size:1.1rem;line-height:1.55;margin:.9rem 0 .5rem;font-weight:500;max-width:62ch}
.notes{margin:.3rem 0 0;display:grid;gap:.7rem}
.notes dt{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--card-muted);font-weight:700}
.notes dd{margin:.1rem 0 0;font-size:.96rem;max-width:62ch}

/* Buttons */
.btn{font:600 .95rem var(--font-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.6rem 1.1rem;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;text-align:center}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.controls{display:grid;grid-template-columns:1fr auto 1fr;gap:.6rem;margin-top:1.1rem;align-items:center}
.controls .prev{justify-self:start}
.controls .next{justify-self:end}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.6rem}
.study-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.75rem;margin-top:1.1rem;font-size:.9rem;color:var(--muted)}
.check{display:inline-flex;gap:.5rem;align-items:center;cursor:pointer}
.check input{width:1.1rem;height:1.1rem;accent-color:var(--accent)}
.link{background:none;border:0;padding:.25rem 0;color:var(--accent);font:500 .9rem var(--font-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.keys{font-size:.8rem;color:var(--muted);margin-top:.6rem}

/* Panels and forms */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.25rem 1.4rem}
.stack{display:grid;gap:1.1rem}
.lede{color:var(--muted);max-width:62ch;margin-top:.35rem}
fieldset{border:0;padding:0;margin:0;min-width:0}
.lbl{display:block;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:.45rem;padding:0}
.pills{display:flex;flex-wrap:wrap;gap:.4rem}
.pill{position:relative;display:inline-flex}
.pill input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.pill span{display:inline-flex;align-items:center;min-height:36px;padding:.35rem .8rem;border:1px solid var(--line);border-radius:999px;font-size:.88rem;font-weight:500}
.pill input:checked + span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.note{font-size:.85rem;color:var(--muted);max-width:64ch;margin-top:.5rem}
.how{margin:.2rem 0 0;padding-left:1.25rem;display:grid;gap:.3rem;max-width:62ch}

/* Quiz + parent */
.qhead{display:flex;justify-content:space-between;gap:1rem;font-weight:600;margin-bottom:.6rem}
.qhead .muted{font-weight:400}
.timer{display:flex;gap:.75rem;align-items:center;margin-bottom:.75rem;font-size:.85rem;color:var(--muted)}
.timer .track{flex:1;height:8px;border-radius:999px;background:var(--track);overflow:hidden}
.timer .fill{height:100%;background:var(--accent);border-radius:999px;transition:width .25s linear}
.timer.low .fill{background:var(--warn)}
.sheet:focus{outline:none}
.sheet:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.sheet{background:var(--card);color:var(--card-ink);border-radius:8px;box-shadow:var(--shadow);padding:1rem 1.6rem 1.4rem}
.prompt{font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--card-muted);margin:.9rem 0 .35rem}
.clue{font-family:var(--font-display);font-size:clamp(1.2rem,3vw,1.5rem);line-height:1.4;max-width:42ch}
.options{list-style:none;margin:1rem 0 0;padding:0;display:grid;gap:.5rem}
.opt{width:100%;justify-content:flex-start;text-align:left;font-weight:500;padding:.7rem 1rem}
.opt .mark{margin-left:auto;font-weight:700;font-size:.85rem;display:inline-flex;gap:.4rem;align-items:center;white-space:nowrap}
.opt.correct{border-color:var(--good);box-shadow:inset 4px 0 0 var(--good)}
.opt.wrong{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
.opt:disabled{opacity:1;cursor:default}
.feedback{margin-top:1rem;display:grid;gap:.6rem}
.verdict{display:flex;gap:.6rem;align-items:center;font-weight:700}
.icon{display:inline-grid;place-items:center;flex:none;width:1.45rem;height:1.45rem;border-radius:50%;color:#fff;font-size:.8rem;font-weight:700;line-height:1}
.icon.good{background:var(--good)}
.icon.bad{background:var(--bad)}
.icon.warn{background:var(--warn);color:#0b0b0b}
.ask-text{font-family:var(--font-display);font-size:clamp(1.3rem,3.4vw,1.7rem);line-height:1.35;max-width:36ch;margin-top:.2rem}
.ask-text.small{font-size:1.15rem}
.key{border-top:2px solid var(--card-rule);margin-top:1rem;padding-top:.9rem;display:grid;gap:.8rem}
.key .lbl{color:var(--card-muted);margin-bottom:.15rem}
.key p{max-width:62ch}
.ratings{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.9rem}
.ratings .btn{flex-direction:column;gap:.25rem;padding:.6rem .5rem}
.ratings small{font-weight:400;color:var(--muted);font-size:.78rem}

/* Results + charts */
.hero{font-size:3.5rem;font-weight:700;line-height:1;letter-spacing:-.01em}
.hero-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.5rem 1.25rem}
.bars{list-style:none;margin:0;padding:0;display:grid;gap:.55rem}
.bar-row{display:grid;grid-template-columns:minmax(7.5rem,11rem) 1fr;gap:.75rem;align-items:center;font-size:.9rem}
.bar-cell{display:flex;align-items:center;gap:.5rem;border-left:1px solid var(--line);min-height:24px;position:relative}
.bar-fill{display:block;height:16px;background:var(--accent);border-radius:0 4px 4px 0}
.bar-val{font-variant-numeric:tabular-nums;color:var(--ink);font-size:.85rem;white-space:nowrap}
.rng-chart{display:grid;gap:0}
.rng-row{display:grid;grid-template-columns:minmax(8rem,13rem) 1fr;gap:.75rem;align-items:stretch;font-size:.9rem}
.rng-row>span:first-child{align-self:center}
.rng-track{position:relative;height:38px;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:20% 100%;border-right:1px solid var(--line)}
.rng{position:absolute;top:12px;height:14px;background:var(--accent);border-radius:4px;cursor:default}
.rng-lab{position:absolute;top:9px;font-size:.82rem;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.rng .tip{position:absolute;bottom:calc(100% + 8px);right:0;background:var(--ink);color:var(--bg);font-size:.78rem;padding:.3rem .5rem;border-radius:4px;white-space:nowrap;pointer-events:none;display:none;z-index:2}
.rng:hover .tip,.rng:focus-visible .tip{display:block}
.rng-axis{display:grid;grid-template-columns:minmax(8rem,13rem) 1fr;gap:.75rem;font-size:.75rem;color:var(--muted)}
.rng-axis .ticks{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.missed{list-style:none;margin:0;padding:0;display:grid}
.missed li{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-top:1px solid var(--line);font-size:.95rem}
.tag{font-size:.75rem;font-weight:600;padding:.1rem .5rem;border-radius:4px;border:1px solid var(--line);white-space:nowrap;display:inline-flex;align-items:center;gap:.35rem}
.row-btns{display:flex;flex-wrap:wrap;gap:.5rem}
textarea{width:100%;font:.85rem/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.75rem}
.hist{list-style:none;margin:0;padding:0;display:grid}
.hist li{display:grid;grid-template-columns:5.5rem 1fr minmax(6rem,9rem);gap:.75rem;align-items:center;padding:.5rem 0;border-top:1px solid var(--line);font-size:.88rem}
.hist .bar-cell{border-left:1px solid var(--line)}

/* Guide */
.guide{display:grid;gap:1.25rem}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:.6rem .9rem .6rem 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.frq{display:grid;gap:.9rem;margin:0;padding:0;list-style:none}
.frq li{display:grid;gap:.2rem;padding-top:.8rem;border-top:1px solid var(--line)}
.frq .nm{font-weight:700}
.reqlist{list-style:none;margin:0;padding:0}
.reqlist li{border-top:1px solid var(--line)}
.reqlist button{appearance:none;background:none;border:0;color:inherit;font:inherit;text-align:left;display:grid;grid-template-columns:1fr auto;gap:.1rem 1rem;width:100%;padding:.65rem .2rem;cursor:pointer}
.reqlist .nm{font-family:var(--font-display);font-size:1.05rem}
.reqlist .ln{grid-column:1/-1;color:var(--muted);font-size:.9rem;max-width:66ch}
.reqlist .go{color:var(--accent);font-size:.85rem;font-weight:600;white-space:nowrap}
.reqlist button:hover .nm{text-decoration:underline;text-underline-offset:3px}
.plan{display:grid;gap:.6rem;margin:0;padding:0;list-style:none}
.plan li{display:grid;grid-template-columns:9.5rem 1fr;gap:.75rem;padding-top:.6rem;border-top:1px solid var(--line)}
.plan b{font-weight:600}
.src{font-size:.82rem;color:var(--muted);max-width:70ch}

@media (max-width:34rem){
  .controls{grid-template-columns:1fr 1fr}
  .controls .flip{grid-column:1/-1;grid-row:1}
  .face{padding:.9rem 1.1rem 1rem;min-height:18rem}
  .sheet{padding:.9rem 1.1rem 1.1rem}
  .keys{display:none}
  .bar-row,.rng-row,.rng-axis{grid-template-columns:6.5rem 1fr}
  .plan li{grid-template-columns:1fr;gap:.15rem}
  .hist li{grid-template-columns:4.5rem 1fr 5.5rem}
  .panel{padding:1rem}
}
@media (prefers-reduced-motion: reduce){
  html:not([data-motion="on"]) .card-inner{transition:none}
  .timer .fill{transition:none}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="masthead">
  <div class="wrap mast-inner">
    <div>
      <p class="kicker">AP U.S. Government &amp; Politics · 2026–27 framework</p>
      <h1>AP Gov Flashcards</h1>
    </div>
    <div class="prefs" role="group" aria-label="Display settings">
      <button type="button" class="ghost" id="size-btn">Text size: Standard</button>
      <button type="button" class="ghost" id="motion-btn" aria-pressed="true">Card animation: On</button>
    </div>
  </div>
  <nav class="wrap tabs" aria-label="Sections">
    <a href="#study" data-view="study">Study cards</a>
    <a href="#quiz" data-view="quiz">Quiz me</a>
    <a href="#parent" data-view="parent">Parent mode</a>
    <a href="#guide" data-view="guide">Exam guide</a>
  </nav>
</header>
<main id="main" class="wrap">
  <section id="view-study" aria-label="Study cards"></section>
  <section id="view-quiz" aria-label="Quiz" hidden></section>
  <section id="view-parent" aria-label="Parent mode" hidden></section>
  <section id="view-guide" aria-label="Exam guide" hidden></section>
</main>
<div id="live" class="sr-only" aria-live="polite"></div>

<script>
/* ---------------------------------------------------------------
   Content. Fields: f front, b answer, why, hook (optional), ex exam tip (optional),
   q parent follow-up, qa its answer, clue (quiz wording that does not give the answer away).
---------------------------------------------------------------- */
const UNITS = {
  1:{name:`Foundations of American Democracy`, short:`Foundations`, w:[15,22]},
  2:{name:`Interactions Among Branches of Government`, short:`Branches`, w:[25,36]},
  3:{name:`Civil Liberties and Civil Rights`, short:`Liberties & Rights`, w:[13,18]},
  4:{name:`American Political Ideologies and Beliefs`, short:`Ideologies`, w:[10,15]},
  5:{name:`Political Participation`, short:`Participation`, w:[20,27]}
};

const CARDS = [
/* ===== UNIT 1 ===== */
{id:`limited-gov`,u:1,t:`concept`,topic:`Ideals of democracy`,f:`Limited government`,
 b:`The idea that government’s power is restricted by law, usually a written constitution, so it can’t take away people’s basic rights.`,
 why:`It’s the thread through the whole Constitution. Separation of powers, checks and balances, federalism, and the Bill of Rights all exist to keep power limited.`,
 hook:`It’s why a principal or police officer can’t search anything they want, any time, for any reason. Power comes with rules.`,
 ex:`Shows up constantly in the Argument Essay (FRQ 4). Pair it with the Declaration, the Constitution, or Federalist 51 as evidence.`,
 q:`Name two features of the Constitution that limit government.`,
 qa:`Any two: separation of powers, checks and balances, federalism, enumerated powers, the Bill of Rights, regular elections.`,
 clue:`The principle that government’s power is restricted by law, usually a written constitution, to protect people’s rights.`},
{id:`natural-rights`,u:1,t:`concept`,topic:`Ideals of democracy`,f:`Natural rights`,
 b:`Rights people are born with that no government grants and none can legitimately take away. John Locke listed them as life, liberty, and property.`,
 why:`Jefferson put this idea at the center of the Declaration of Independence (“life, liberty and the pursuit of happiness”). It justified breaking away from Britain.`,
 ex:`Expect a multiple-choice passage from the Declaration asking which Enlightenment idea it reflects.`,
 q:`According to the Declaration, what may people do if a government violates these rights?`,
 qa:`“Alter or abolish” it and set up a new government. That’s the social contract at work.`},
{id:`social-contract`,u:1,t:`concept`,topic:`Ideals of democracy`,f:`Social contract`,
 b:`The deal in which people agree to give up some freedom and obey a government in exchange for protection of their rights. If the government breaks the deal, the people may replace it.`,
 why:`It comes from Hobbes, Locke, and Rousseau, and it explains why American government rests on the consent of the governed.`,
 hook:`Think of school rules: you accept a bell schedule and a code of conduct in exchange for a safe school that works.`,
 q:`How does the social contract connect to popular sovereignty?`,
 qa:`Both say government’s authority comes from the people’s consent. People create the government, so power flows from them.`},
{id:`popular-sovereignty`,u:1,t:`concept`,topic:`Ideals of democracy`,f:`Popular sovereignty`,
 b:`The principle that government’s authority comes from the people.`,
 why:`The Constitution opens with “We the People,” not “We the States.” Elections and the amendment process put this idea into practice.`,
 ex:`A classic multiple-choice pairing: the Preamble or the Gettysburg Address → popular sovereignty.`,
 q:`Give one place popular sovereignty appears in the Constitution or in practice.`,
 qa:`The Preamble (“We the People”), elections, ratification by state conventions, the amendment process, or state ballot initiatives.`},
{id:`republicanism`,u:1,t:`concept`,topic:`Ideals of democracy`,f:`Republicanism`,
 b:`A system in which citizens elect representatives to make laws for them, instead of voting on every law directly.`,
 why:`The Framers chose a republic over direct democracy because they feared fast-moving majorities. Madison defends it in Federalist 10.`,
 hook:`You’ll vote for a member of Congress. You won’t vote on each bill they pass.`,
 q:`Why did Madison think a large republic was better than a direct democracy?`,
 qa:`Representatives filter public passions, and a large republic contains so many factions that no single one can easily dominate.`},
{id:`participatory`,u:1,t:`concept`,topic:`Models of democracy`,f:`Participatory democracy`,
 b:`A model that emphasizes broad participation in politics and civil society by as many citizens as possible.`,
 why:`One of three models of representative democracy on the exam. Examples: state ballot initiatives, referendums, recall elections, town halls.`,
 ex:`The exam loves “Which model does this scenario show?” Broad citizen involvement = participatory.`,
 q:`Give a real example of participatory democracy in action.`,
 qa:`A state ballot initiative or referendum, a recall election, a town hall meeting, or a grassroots campaign.`,
 clue:`A model of democracy that emphasizes involvement by as many citizens as possible, through things like ballot initiatives and town halls.`},
{id:`pluralist`,u:1,t:`concept`,topic:`Models of democracy`,f:`Pluralist democracy`,
 b:`A model in which organized groups compete to influence policy, and no single group dominates.`,
 why:`Interest groups like AARP, the NRA, and the Sierra Club fit here. Federalist 10’s argument about many competing factions supports this view.`,
 q:`Why might a pluralist argue that interest groups are good for democracy?`,
 qa:`Groups give ordinary people a louder collective voice, and competition among them keeps any one group from controlling policy.`},
{id:`elite`,u:1,t:`concept`,topic:`Models of democracy`,f:`Elite democracy`,
 b:`A model in which a small group of wealthy, educated, or well-connected people has outsized influence over political decisions.`,
 why:`The Framers built in elite features: the Electoral College and (until the 17th Amendment in 1913) senators chosen by state legislatures. Brutus 1 warned a distant national government would serve elites.`,
 q:`Name one feature of the original Constitution that reflects elite democracy.`,
 qa:`The Electoral College, or senators chosen by state legislatures before the 17th Amendment.`},
{id:`d-declaration`,u:1,t:`doc`,topic:`Ideals of democracy`,f:`Declaration of Independence (1776)`,
 b:`Thomas Jefferson’s statement that people have natural rights, that government gets its power from the consent of the governed, and that people may abolish a government that abuses those rights. It lists grievances against King George III.`,
 why:`It applies Locke’s ideas of natural rights and the social contract. It explains why the colonies broke away, though it doesn’t set up a government.`,
 ex:`Strong Argument Essay evidence for limited government, natural rights, or popular sovereignty.`,
 q:`The Declaration created no government. Why is it still a foundational document?`,
 qa:`It states the core principles (natural rights, consent of the governed, the social contract) that the Constitution was later built to protect.`,
 clue:`Jefferson’s statement of natural rights, consent of the governed, and grievances against King George III.`},
{id:`d-articles`,u:1,t:`doc`,topic:`Articles & Constitution`,f:`Articles of Confederation (1781)`,
 b:`The first U.S. constitution, in effect until 1789. It created a weak national government: no power to tax, no national army, no executive or national courts, no power to regulate trade between states, and amendments required all 13 states.`,
 why:`Its failures, made obvious by Shays’ Rebellion, led directly to the Constitutional Convention. Each weakness maps to a fix in the Constitution.`,
 ex:`A common question: how did the Constitution fix a specific weakness of the Articles?`,
 q:`Name a weakness of the Articles and how the Constitution fixed it.`,
 qa:`No power to tax → Congress can tax (Art. I, Sec. 8). No executive → a president (Art. II). No national courts → Supreme Court (Art. III). Unanimity to amend → Article V’s three-fourths rule.`,
 clue:`The first U.S. constitution, which created a national government with no power to tax and no executive.`},
{id:`shays`,u:1,t:`concept`,topic:`Articles & Constitution`,f:`Shays’ Rebellion (1786–87)`,
 b:`An armed uprising of indebted Massachusetts farmers. The national government under the Articles had no army or money to stop it.`,
 why:`It exposed how weak the Articles of Confederation were and pushed leaders to call the Constitutional Convention in 1787.`,
 q:`What weaknesses of the Articles did Shays’ Rebellion reveal?`,
 qa:`No power to tax, no national army or executive to enforce laws, and no way to respond quickly to a crisis.`,
 clue:`An uprising of indebted Massachusetts farmers that the national government was too weak to stop.`},
{id:`great-compromise`,u:1,t:`concept`,topic:`Articles & Constitution`,f:`Great (Connecticut) Compromise`,
 b:`The agreement that created a two-house Congress: a House of Representatives based on state population and a Senate with two senators per state.`,
 why:`It settled the fight between large states (Virginia Plan) and small states (New Jersey Plan). It’s why Wyoming and California each have two senators.`,
 ex:`Be ready to explain which plan each house came from.`,
 q:`Which house reflects the Virginia Plan, and which reflects the New Jersey Plan?`,
 qa:`House = Virginia Plan (population). Senate = New Jersey Plan (equal representation).`},
{id:`three-fifths`,u:1,t:`concept`,topic:`Articles & Constitution`,f:`Three-Fifths Compromise`,
 b:`The agreement to count enslaved people as three-fifths of a person when apportioning House seats and direct taxes.`,
 why:`It boosted Southern states’ power in the House and the Electoral College. The 13th and 14th Amendments ended it after the Civil War.`,
 q:`How did this compromise affect presidential elections, not just the House?`,
 qa:`Electoral votes equal a state’s House seats plus Senate seats, so extra House seats gave Southern states extra electoral votes.`,
 clue:`The deal that counted enslaved people as a fraction of a person when deciding each state’s number of House seats.`},
{id:`d-constitution`,u:1,t:`doc`,topic:`Articles & Constitution`,f:`U.S. Constitution (1787)`,
 b:`The framework of the national government. It creates three branches, divides power between the nation and the states, and sets out how it can be amended. The Bill of Rights was added in 1791.`,
 why:`It is the source for nearly every concept on the exam: separation of powers, checks and balances, federalism, enumerated powers, and individual rights.`,
 ex:`Know the articles: I Congress, II President, III Courts, IV relations among states, V amendments, VI supremacy, VII ratification.`,
 q:`What does Article VI establish, and why does it matter?`,
 qa:`The Supremacy Clause. Valid federal law beats conflicting state law, which decided cases like McCulloch v. Maryland.`,
 clue:`The 1787 framework that created three branches and divided power between the nation and the states.`},
{id:`amendment`,u:1,t:`concept`,topic:`Articles & Constitution`,f:`Amendment process (Article V)`,
 b:`Amendments are proposed by two-thirds of both houses of Congress (or a convention called by two-thirds of the states) and ratified by three-fourths of the states.`,
 why:`The supermajority requirements make the Constitution hard to change, which is why there are only 27 amendments.`,
 ex:`Know the numbers: two-thirds to propose, three-fourths to ratify.`,
 q:`Why did the Framers make amending the Constitution so difficult?`,
 qa:`To protect it from temporary majorities and to require broad national agreement before changing the basic rules.`,
 clue:`Two-thirds of both houses of Congress propose; three-fourths of the states ratify.`},
{id:`separation`,u:1,t:`concept`,topic:`Articles & Constitution`,f:`Separation of powers`,
 b:`Dividing government into three branches: legislative (makes laws), executive (enforces laws), and judicial (interprets laws).`,
 why:`Madison argued in Federalist 51 that splitting power prevents tyranny. Each branch has its own article: I, II, and III.`,
 q:`Which articles of the Constitution set up each branch?`,
 qa:`Article I: Congress. Article II: the President. Article III: the courts.`},
{id:`checks`,u:1,t:`concept`,topic:`Articles & Constitution`,f:`Checks and balances`,
 b:`Each branch has tools to limit the others, such as the presidential veto, the congressional override, Senate confirmation, impeachment, and judicial review.`,
 why:`The goal is to make “ambition counteract ambition” (Federalist 51), so no branch can dominate.`,
 ex:`Concept Application (FRQ 1) often gives a scenario and asks how another branch could respond. Have two or three checks ready for each branch.`,
 q:`Give one check Congress has on the president and one check the courts have on Congress.`,
 qa:`Congress: override a veto (two-thirds of both houses), reject appointments, impeach, control funding. Courts: strike down a law as unconstitutional.`},
{id:`d-fed51`,u:1,t:`doc`,topic:`Articles & Constitution`,f:`Federalist No. 51 (Madison, 1788)`,
 b:`Madison argues that separation of powers and checks and balances will protect liberty: “Ambition must be made to counteract ambition.” Federalism adds a “double security” by dividing power between nation and states.`,
 why:`Its famous line, “If men were angels, no government would be necessary,” explains why the Constitution assumes people will seek power and builds in ways to stop them.`,
 ex:`Go-to evidence for any argument about checks and balances, separation of powers, or limiting government.`,
 q:`What does “ambition must be made to counteract ambition” mean in practice?`,
 qa:`Each branch’s officials will defend their own branch’s power, which keeps any other branch from taking too much.`,
 clue:`Madison argues that separation of powers and checks and balances let “ambition counteract ambition.”`},
{id:`d-fed10`,u:1,t:`doc`,topic:`Articles & Constitution`,f:`Federalist No. 10 (Madison, 1787)`,
 b:`Madison argues that factions (groups pursuing their own interests) are unavoidable. The cure is to control their effects with a large republic, where so many factions compete that no single one can take over.`,
 why:`The key defense of a large republic and a foundation for the pluralist view of democracy. It answers Anti-Federalist fears like those in Brutus 1.`,
 ex:`Federalist 10 vs. Brutus 1 is one of the most tested comparisons on the exam.`,
 q:`Madison says you can’t remove the causes of faction. Why not, and what does he do instead?`,
 qa:`Removing the causes would mean destroying liberty or making everyone think alike. Instead, a large republic controls the effects.`,
 clue:`Madison argues that a large republic best controls the effects of factions.`},
{id:`d-brutus`,u:1,t:`doc`,topic:`Articles & Constitution`,f:`Brutus No. 1 (Anti-Federalist, 1787)`,
 b:`Argues that a large republic can’t work. The Necessary and Proper and Supremacy Clauses would give the national government nearly unlimited power, and a distant government would serve elites instead of ordinary people.`,
 why:`The leading Anti-Federalist essay. Its fears helped win the Bill of Rights, and its debate with Federalist 10 still frames arguments about national vs. state power.`,
 ex:`If an essay prompt involves states’ rights or limits on national power, Brutus 1 is strong evidence.`,
 q:`What would Brutus think of the Supreme Court’s decision in McCulloch v. Maryland?`,
 qa:`He’d see it as proof of his fear: the Court used the Necessary and Proper and Supremacy Clauses to expand national power over the states.`,
 clue:`An Anti-Federalist argues a large republic can’t work and that the Necessary and Proper Clause gives Congress too much power.`},
{id:`d-fed39`,u:1,t:`doc`,isNew:true,topic:`Federalism`,f:`Federalist No. 39 (Madison, 1788)`,
 b:`Madison defines a republic as a government that gets its power from the people and is run by officials who serve limited terms or during good behavior. He argues the Constitution is “neither a national nor a federal Constitution, but a composition of both.”`,
 why:`It answers critics who said the Constitution would wipe out the states. Madison shows that some parts draw power from the people (the House), some from the states as equals (the Senate), and some from both (amendments).`,
 ex:`New to the required list for 2026–27. Use it as evidence on federalism or popular sovereignty questions.`,
 q:`Give one example of how the Constitution is “partly national, partly federal.”`,
 qa:`The House draws power directly from the people (national); the Senate gives states equal representation (federal); amendments need both Congress and the states.`,
 clue:`Madison defines a republic and argues the Constitution is a mix of national and federal features.`},
{id:`federalism`,u:1,t:`concept`,topic:`Federalism`,f:`Federalism`,
 b:`Power divided between a national government and state governments, each with its own authority over the same people.`,
 why:`Madison called it a “double security” for rights in Federalist 51. The balance between national and state power has shifted constantly since 1787.`,
 hook:`Your state sets the rules for your driver’s license. The national government prints your money.`,
 q:`Give one power that belongs to the national government and one reserved to the states.`,
 qa:`National: coining money, declaring war, regulating interstate commerce, making treaties. States: running elections, issuing licenses, setting up schools and local governments.`,
 clue:`The division of power between a national government and state governments.`},
{id:`enumerated`,u:1,t:`concept`,topic:`Federalism`,f:`Enumerated (expressed) powers`,
 b:`Powers specifically listed for Congress in the Constitution, mostly in Article I, Section 8: taxing, borrowing, coining money, regulating interstate commerce, declaring war, and more.`,
 q:`Is “creating a national bank” one of these powers? How did Congress justify it?`,
 qa:`No. Congress justified it as an implied power under the Necessary and Proper Clause, upheld in McCulloch v. Maryland.`},
{id:`necessary-proper`,u:1,t:`concept`,topic:`Federalism`,f:`Necessary and Proper (Elastic) Clause`,
 b:`The last clause of Article I, Section 8. It lets Congress make all laws “necessary and proper” for carrying out its listed powers, which creates implied powers.`,
 why:`It stretches national power, which is why it’s called the elastic clause. McCulloch v. Maryland upheld it. Brutus 1 feared it would give Congress nearly unlimited power.`,
 ex:`This clause links McCulloch (a required case) and Brutus 1 (a required document). That’s a ready-made essay connection.`,
 q:`Why did Anti-Federalists like Brutus fear this clause?`,
 qa:`They thought its vague wording would let the national government expand without limit and swallow up state power.`,
 clue:`The clause at the end of Article I, Section 8 that gives Congress implied powers to carry out its listed powers.`},
{id:`tenth`,u:1,t:`concept`,topic:`Federalism`,f:`Reserved powers (10th Amendment)`,
 b:`Powers not given to the national government, nor denied to the states, are reserved to the states or to the people.`,
 why:`It’s the constitutional basis for state control over schools, policing, marriage law, and elections. States cite it whenever they push back on federal power.`,
 q:`Which required case is a win for state power under this idea?`,
 qa:`United States v. Lopez (1995). The Court said Congress overstepped the Commerce Clause, leaving guns near schools to state law.`,
 clue:`Powers not given to the national government, nor denied to the states, belong to the states or the people.`},
{id:`commerce`,u:1,t:`concept`,topic:`Federalism`,f:`Commerce Clause`,
 b:`Article I, Section 8 gives Congress the power to regulate commerce “among the several States.” Courts have read it broadly to expand federal power.`,
 why:`Congress used it to pass the Civil Rights Act of 1964 (banning discrimination at restaurants and hotels) and much environmental law. Lopez (1995) marked a limit.`,
 ex:`Questions often pair McCulloch (national power grows) with Lopez (national power has limits).`,
 q:`How is Lopez different from most earlier cases about this clause?`,
 qa:`For decades the Court let Congress stretch it. In Lopez it said carrying a gun near a school isn’t economic activity, so Congress went too far.`,
 clue:`The Article I power Congress used to pass civil rights and environmental laws, which the Court limited in 1995.`},
{id:`supremacy`,u:1,t:`concept`,topic:`Federalism`,f:`Supremacy Clause`,
 b:`Article VI says the Constitution, federal laws, and treaties are “the supreme Law of the Land.” When a valid federal law conflicts with a state law, federal law wins.`,
 why:`It’s why Maryland lost in McCulloch v. Maryland: a state can’t tax or obstruct a legitimate federal institution.`,
 q:`In McCulloch, which two constitutional clauses did the Court rely on?`,
 qa:`The Necessary and Proper Clause (Congress could create the bank) and the Supremacy Clause (Maryland couldn’t tax it).`,
 clue:`The Article VI rule that valid federal law wins when it conflicts with state law.`},
{id:`grants`,u:1,t:`concept`,topic:`Federalism`,f:`Categorical vs. block grants`,
 b:`Categorical grants give states federal money for a specific purpose with strict conditions. Block grants give money for a broad purpose with more state flexibility.`,
 why:`This is fiscal federalism: Washington uses money to shape state policy. States usually prefer block grants because they keep more control.`,
 hook:`School lunch programs and special education services run partly on federal grant money with federal rules attached.`,
 ex:`A favorite Concept Application scenario. Know which type each side of a debate prefers and why.`,
 q:`Why would a governor prefer a block grant over a categorical grant?`,
 qa:`Block grants let the state decide how to spend the money to fit local needs, with fewer federal strings.`,
 clue:`Two kinds of federal money for states: one comes with strict rules for a specific purpose, the other allows broad flexibility.`},
{id:`mandates`,u:1,t:`concept`,topic:`Federalism`,f:`Mandates and unfunded mandates`,
 b:`Federal requirements that states must follow. When Congress doesn’t provide money to pay for them, they’re called unfunded mandates.`,
 why:`The Americans with Disabilities Act (1990) is the textbook example: it requires state and local governments to make buildings, programs, and services accessible, largely at their own expense.`,
 q:`Why do states often object to unfunded mandates?`,
 qa:`States must pay to carry out federal policy without federal money, which strains budgets and limits state control.`,
 clue:`Federal requirements states must follow, sometimes without federal money to pay for them, such as the ADA’s accessibility rules.`},
{id:`conditions`,u:1,t:`concept`,topic:`Federalism`,f:`Conditions of aid`,
 b:`Rules a state must accept to receive federal money. In 1984 Congress threatened to withhold some highway funds from any state with a drinking age below 21. Every state complied.`,
 why:`The Supreme Court upheld this in South Dakota v. Dole (1987). It shows how the national government can shape policy in areas it doesn’t directly control.`,
 hook:`This is why the drinking age is 21 in all 50 states, even though no federal law sets it.`,
 q:`Why didn’t Congress just pass a national drinking-age law?`,
 qa:`Setting a drinking age is generally a state power, so Congress used its spending power and attached conditions to highway money.`},
{id:`dual-coop`,u:1,t:`concept`,topic:`Federalism`,f:`Dual vs. cooperative federalism`,
 b:`Dual (“layer cake”) federalism keeps national and state powers in separate spheres. Cooperative (“marble cake”) federalism has both levels working together on shared policies, often through grants.`,
 why:`The U.S. moved from mostly dual federalism toward cooperative federalism during the New Deal of the 1930s.`,
 q:`Give an example of cooperative federalism.`,
 qa:`Medicaid (paid for jointly by federal and state governments), highway funding, or education grants.`,
 clue:`The shift from “layer cake” to “marble cake” relationships between national and state governments.`},
{id:`c-mcculloch`,u:1,t:`case`,topic:`Federalism`,f:`McCulloch v. Maryland (1819)`,
 b:`Maryland tried to tax the Second Bank of the United States. The Court ruled unanimously that Congress had implied power to create the bank (Necessary and Proper Clause) and that a state can’t tax a federal institution (Supremacy Clause).`,
 why:`It expanded national power over the states. Chief Justice Marshall wrote that “the power to tax involves the power to destroy.”`,
 ex:`Clauses: Necessary and Proper + Supremacy. Pairs with Brutus 1, Federalist 10, and federalism questions.`,
 q:`Which level of government won, and why does that still matter?`,
 qa:`The national government. It set the precedent that Congress has implied powers and that valid federal law overrides state law.`,
 clue:`The Court ruled Congress could create a national bank under its implied powers and that a state could not tax it.`},
{id:`c-lopez`,u:1,t:`case`,topic:`Federalism`,f:`United States v. Lopez (1995)`,
 b:`A high school senior in San Antonio was charged under the federal Gun-Free School Zones Act of 1990 for bringing a gun to school. The Court ruled 5–4 that Congress had exceeded its Commerce Clause power, because carrying a gun near a school isn’t economic activity.`,
 why:`The first time in about 60 years the Court limited Congress’s Commerce Clause power. A win for states’ reserved powers.`,
 hook:`The student at the center of this case was a 12th grader.`,
 ex:`Contrast with McCulloch: McCulloch expanded national power; Lopez limited it.`,
 q:`Why couldn’t Congress use the Commerce Clause here?`,
 qa:`Bringing a gun to school isn’t commercial activity that substantially affects interstate commerce, so it falls under state police powers.`,
 clue:`The Court ruled the Gun-Free School Zones Act went beyond Congress’s Commerce Clause power.`},
{id:`d-gettysburg`,u:1,t:`doc`,isNew:true,topic:`Ideals of democracy`,f:`Gettysburg Address (Lincoln, 1863)`,
 b:`Lincoln’s short speech at a Civil War battlefield. It ties the war to the Declaration’s promise that “all men are created equal” and calls for “a new birth of freedom” so that “government of the people, by the people, for the people, shall not perish from the earth.”`,
 why:`It reframes the Union as a commitment to equality and popular sovereignty. It’s about 270 words, so read the whole thing.`,
 ex:`New to the required list for 2026–27. Strong evidence for popular sovereignty, equality, or national unity.`,
 q:`Which earlier foundational document does the Gettysburg Address echo, and how?`,
 qa:`The Declaration of Independence. “Four score and seven years ago” points back to 1776, and Lincoln repeats its claim that all men are created equal.`,
 clue:`Lincoln’s battlefield speech calling for “a new birth of freedom” and “government of the people, by the people, for the people.”`},

/* ===== UNIT 2 ===== */
{id:`house-senate`,u:2,t:`concept`,topic:`Congress`,f:`House vs. Senate`,
 b:`House: 435 members, 2-year terms, seats based on population, minimum age 25. Senate: 100 members (two per state), 6-year terms with one-third elected every two years, minimum age 30.`,
 why:`The House was designed to respond quickly to public opinion; the Senate was designed to be slower and more deliberate.`,
 q:`Name one power only the House has and one only the Senate has.`,
 qa:`House: starts revenue (tax) bills, impeaches. Senate: confirms appointments, ratifies treaties (two-thirds vote), holds impeachment trials.`,
 clue:`One chamber has 435 members on 2-year terms; the other has 100 members on 6-year terms.`},
{id:`filibuster`,u:2,t:`concept`,topic:`Congress`,f:`Filibuster and cloture`,
 b:`A filibuster is a Senate tactic of extended debate to delay or block a vote. Cloture ends debate and requires 60 votes.`,
 why:`Because of the filibuster, most major bills effectively need 60 Senate votes, not a simple majority of 51. The House has no filibuster because its Rules Committee limits debate.`,
 hook:`When the news says a bill “doesn’t have 60 votes,” this is why.`,
 q:`Why doesn’t the House have a filibuster?`,
 qa:`The House is much larger, so its Rules Committee sets strict time limits on debate for each bill.`,
 clue:`A Senate delaying tactic, and the 60-vote motion that ends it.`},
{id:`rules-committee`,u:2,t:`concept`,topic:`Congress`,f:`House Rules Committee`,
 b:`The House committee that decides when a bill reaches the floor, how long it can be debated, and whether amendments are allowed.`,
 why:`It’s the House’s traffic cop. The majority party controls it, which gives the Speaker major power over what gets a vote.`,
 q:`How does this committee give the majority party power?`,
 qa:`It can keep bills it dislikes off the floor and block amendments that would change bills it supports.`,
 clue:`The House committee that decides when bills reach the floor and how long they can be debated.`},
{id:`committees`,u:2,t:`concept`,topic:`Congress`,f:`Congressional committees`,
 b:`Small groups of members that review bills in specific policy areas (standing committees), hold hearings, and decide which bills move forward. Conference committees work out differences between House and Senate versions.`,
 why:`Most bills die in committee. Committees let members specialize and are where Congress does most of its oversight of the executive branch.`,
 q:`Why do most bills die in committee?`,
 qa:`Committees screen thousands of bills and advance only the ones the chair and party leaders support or have time for.`},
{id:`spending`,u:2,t:`concept`,topic:`Congress`,f:`Mandatory vs. discretionary spending`,
 b:`Mandatory spending is required by existing law, mostly entitlements like Social Security, Medicare, and Medicaid. Discretionary spending is set each year through appropriations bills, including defense and education.`,
 why:`Mandatory spending plus interest on the debt is roughly 70% of the federal budget and growing, which shrinks what Congress decides each year. That squeeze drives budget fights.`,
 hook:`Look at your first paycheck: the FICA line (7.65% = 6.2% Social Security + 1.45% Medicare) funds the biggest mandatory programs.`,
 ex:`The Quantitative Analysis FRQ often uses budget charts. Know which programs fall in which category.`,
 q:`Why is it hard to cut the deficit by trimming discretionary spending alone?`,
 qa:`Discretionary spending is the smaller share. The biggest, fastest-growing costs are entitlements and interest, which change only if Congress changes the underlying laws.`,
 clue:`Two budget categories: one is required by existing law (like Social Security), the other is set each year through appropriations.`},
{id:`reapportion`,u:2,t:`concept`,topic:`Congress`,f:`Reapportionment vs. redistricting`,
 b:`Reapportionment reassigns the 435 House seats among the states after each census (every 10 years). Redistricting is when states redraw district lines to match the new seat counts and population shifts.`,
 why:`Whoever draws the lines can influence who wins. That leads directly to gerrymandering and to Baker v. Carr and Shaw v. Reno.`,
 q:`Who usually draws congressional district lines?`,
 qa:`State legislatures, though some states use independent or bipartisan commissions.`,
 clue:`Reassigning House seats among states after the census, then redrawing district lines within each state.`},
{id:`gerrymandering`,u:2,t:`concept`,topic:`Congress`,f:`Gerrymandering`,
 b:`Drawing district lines to give one party or group an advantage. Two techniques: packing (concentrating opponents in a few districts) and cracking (spreading them thin across many).`,
 why:`Racial gerrymanders can violate Equal Protection (Shaw v. Reno). In Rucho v. Common Cause (2019), the Court said federal courts won’t decide partisan gerrymandering claims.`,
 ex:`Link it to Baker v. Carr and Shaw v. Reno on the SCOTUS Comparison FRQ.`,
 q:`What’s the difference between packing and cracking?`,
 qa:`Packing crowds the other side’s voters into a few districts they win by huge margins; cracking splits them across many districts so they can’t win any.`},
{id:`c-baker`,u:2,t:`case`,topic:`Congress`,f:`Baker v. Carr (1962)`,
 b:`Tennessee hadn’t redrawn its legislative districts since 1901, so rural votes counted far more than city votes. The Court ruled that redistricting challenges are justiciable: federal courts can hear them under the Equal Protection Clause.`,
 why:`It opened the door to the “one person, one vote” rulings that followed, such as Reynolds v. Sims (1964).`,
 ex:`Pair with Shaw v. Reno. Both involve redistricting and the 14th Amendment.`,
 q:`What does “justiciable” mean here, and why did it matter?`,
 qa:`It means a court can decide the issue. Before Baker, courts treated districting as a political question; after Baker, voters could sue over unequal districts.`,
 clue:`The Court ruled that federal courts can hear challenges to unequal legislative districts, opening the door to “one person, one vote.”`},
{id:`c-shaw`,u:2,t:`case`,topic:`Congress`,f:`Shaw v. Reno (1993)`,
 b:`North Carolina drew a long, snaking majority-Black congressional district. The Court ruled that districts drawn mainly on the basis of race must pass strict scrutiny under the Equal Protection Clause.`,
 why:`It limits racial gerrymandering, even when the goal is to increase minority representation.`,
 q:`What’s the constitutional basis of this decision?`,
 qa:`The 14th Amendment’s Equal Protection Clause.`,
 clue:`The Court ruled that congressional districts drawn mainly by race must pass strict scrutiny.`},
{id:`representation`,u:2,t:`concept`,topic:`Congress`,f:`Trustee, delegate, and politico`,
 b:`Three models of how lawmakers vote. Trustee: uses their own judgment. Delegate: votes the way constituents want. Politico: balances the two depending on the issue.`,
 q:`A senator votes against a bill most of her state supports because she thinks it’s bad policy. Which model is that?`,
 qa:`Trustee.`,
 clue:`Three models of how lawmakers decide votes: by their own judgment, by constituents’ wishes, or a mix of both.`},
{id:`divided-gov`,u:2,t:`concept`,topic:`Congress`,f:`Divided government and gridlock`,
 b:`Divided government means one party holds the presidency and the other controls at least one house of Congress. Gridlock is the resulting difficulty in passing laws.`,
 why:`It affects confirmations, budgets, and how often vetoes happen. A common Concept Application scenario.`,
 q:`How might divided government affect judicial confirmations?`,
 qa:`A Senate controlled by the other party can delay or reject the president’s nominees.`,
 clue:`One party holds the presidency while the other controls at least one chamber of Congress, often slowing lawmaking.`},
{id:`formal-powers`,u:2,t:`concept`,topic:`Presidency`,f:`President’s formal powers`,
 ask:`Name the president’s formal powers from Article II.`,
 b:`Powers listed in Article II: commander in chief, veto bills, make treaties (with Senate approval), appoint officials and judges (with Senate approval), grant pardons, and receive ambassadors.`,
 q:`Which formal powers require Senate approval?`,
 qa:`Treaties (two-thirds vote) and major appointments such as cabinet secretaries, ambassadors, and federal judges (majority vote).`},
{id:`informal-powers`,u:2,t:`concept`,topic:`Presidency`,f:`President’s informal powers`,
 ask:`What are the president’s informal powers? Give examples.`,
 b:`Powers not listed in the Constitution but used by presidents: executive orders, executive agreements, signing statements, and the bully pulpit.`,
 why:`Presidents have expanded these powers over time, especially when Congress is gridlocked.`,
 q:`Why have informal powers grown?`,
 qa:`Congress is often slow or divided, so presidents act on their own, and modern media amplifies the president’s voice.`,
 clue:`The category of presidential tools not listed in the Constitution, including executive orders, executive agreements, and signing statements.`},
{id:`exec-order`,u:2,t:`concept`,topic:`Presidency`,f:`Executive order`,
 b:`A directive from the president to the executive branch that carries the force of law, based on authority from the Constitution or from a law Congress passed.`,
 why:`It’s fast and needs no one’s approval, but it’s fragile. A new president can reverse it, Congress can override it by law, and courts can strike it down.`,
 ex:`A classic FRQ 1 task: “Explain how Congress or the courts could check this action.”`,
 q:`Name two ways this kind of action can be checked.`,
 qa:`Courts can rule it unconstitutional or beyond the president’s authority; Congress can pass a law overriding it or cut its funding; a later president can revoke it.`},
{id:`exec-agreement`,u:2,t:`concept`,topic:`Presidency`,f:`Executive agreement`,
 b:`An agreement between the president and a foreign leader that doesn’t require Senate ratification.`,
 why:`Presidents use them to avoid the two-thirds Senate vote that treaties need. They are less permanent than treaties.`,
 q:`Why would a president use this instead of a treaty?`,
 qa:`To avoid needing two-thirds of the Senate, which is hard to get, especially in divided government.`,
 clue:`A deal between the president and a foreign leader that skips the Senate’s two-thirds vote.`},
{id:`veto`,u:2,t:`concept`,topic:`Presidency`,f:`Veto and pocket veto`,
 b:`A veto is the president’s rejection of a bill, which Congress can override with a two-thirds vote in both houses. A pocket veto happens when the president doesn’t sign a bill within 10 days (Sundays excepted) and Congress has adjourned, so the bill dies with no chance of override.`,
 q:`Why is a pocket veto stronger than a regular veto?`,
 qa:`Congress has adjourned, so it can’t vote to override.`,
 clue:`The president’s rejection of a bill, including the version that happens when Congress has adjourned and can’t override.`},
{id:`war-powers`,u:2,t:`concept`,topic:`Presidency`,f:`War Powers Resolution (1973)`,
 b:`A law passed after the Vietnam War. The president must notify Congress within 48 hours of sending troops into combat and must withdraw them within 60 days (plus a 30-day withdrawal period) unless Congress approves.`,
 why:`Congress declares war, but the president is commander in chief. This law was Congress’s attempt to rebalance that tension. Presidents of both parties have questioned whether it’s constitutional.`,
 q:`Which two constitutional roles does this law try to balance?`,
 qa:`Congress’s power to declare war and the president’s role as commander in chief.`,
 clue:`A 1973 law requiring the president to notify Congress within 48 hours of sending troops into combat.`},
{id:`bully-pulpit`,u:2,t:`concept`,topic:`Presidency`,f:`Bully pulpit`,
 b:`The president’s ability to use the visibility of the office to persuade the public and pressure Congress.`,
 why:`Theodore Roosevelt coined the phrase. Today it includes televised addresses, the State of the Union, and social media.`,
 hook:`Every presidential post that trends online is this power at work.`,
 q:`How does it help a president get legislation passed?`,
 qa:`By rallying public support, which pressures members of Congress who worry about reelection.`},
{id:`impeachment`,u:2,t:`concept`,topic:`Presidency`,f:`Impeachment and removal`,
 b:`The House impeaches (formally charges) by a simple majority. The Senate holds a trial and removes the official only with a two-thirds vote.`,
 why:`It’s Congress’s ultimate check on the executive and judicial branches. The Senate has never removed a president.`,
 q:`Which house acts like a prosecutor, and which acts like a jury?`,
 qa:`The House brings charges, like a prosecutor; the Senate holds the trial, like a jury.`,
 clue:`The House brings charges by majority vote; the Senate removes the official only with two-thirds.`},
{id:`22nd`,u:2,t:`concept`,topic:`Presidency`,f:`22nd Amendment`,
 b:`Ratified in 1951, it limits a president to two elected terms.`,
 why:`Passed after Franklin Roosevelt won four elections. It reflects a long-running fear, shared by the Anti-Federalists, of concentrated executive power.`,
 q:`Which foundational document makes the case for a strong executive?`,
 qa:`Federalist No. 70, by Alexander Hamilton.`,
 clue:`The 1951 amendment limiting presidents to two elected terms.`},
{id:`d-fed70`,u:2,t:`doc`,topic:`Presidency`,f:`Federalist No. 70 (Hamilton, 1788)`,
 b:`Hamilton argues for a single, energetic executive. “Energy in the executive” means acting quickly and decisively, and one person (not a council) is easier to hold accountable.`,
 why:`It defends the presidency against Anti-Federalist fears of a king. Use it to explain why presidential power has grown.`,
 ex:`Strong Argument Essay evidence on presidential power or accountability.`,
 q:`Why does Hamilton prefer one president over an executive council?`,
 qa:`One executive can act with speed and decisiveness, and it’s clear who gets the blame or credit, which makes the office accountable.`,
 clue:`Hamilton argues for a single, energetic executive.`},
{id:`d-emancipation`,u:2,t:`doc`,isNew:true,topic:`Presidency`,f:`Emancipation Proclamation (Lincoln, 1863)`,
 b:`Lincoln’s order, effective January 1, 1863, declaring enslaved people in the states in rebellion “forever free.” Issued as a war measure under his power as commander in chief, it didn’t apply to the border states loyal to the Union.`,
 why:`It turned the Civil War into a war against slavery and opened the Union army to Black soldiers. Because it was a wartime executive action, the 13th Amendment (1865) was needed to end slavery permanently everywhere.`,
 ex:`New to the required list for 2026–27. Use it for civil rights and for the reach and limits of presidential power.`,
 q:`Why was the 13th Amendment still needed after the Proclamation?`,
 qa:`The Proclamation was a wartime executive action that covered only rebelling states and could have been challenged after the war. An amendment made abolition permanent and nationwide.`,
 clue:`Lincoln’s 1863 war measure declaring enslaved people in the rebelling states free.`},
{id:`judicial-review`,u:2,t:`concept`,topic:`Courts`,f:`Judicial review`,
 b:`The power of courts to strike down laws or government actions that violate the Constitution.`,
 why:`It isn’t written in the Constitution. Hamilton defended it in Federalist 78, and the Court claimed it in Marbury v. Madison (1803).`,
 q:`Where does this power come from, if the Constitution doesn’t mention it?`,
 qa:`Marbury v. Madison (1803), building on Hamilton’s argument in Federalist 78.`,
 clue:`The power of courts to strike down laws that violate the Constitution.`},
{id:`c-marbury`,u:2,t:`case`,topic:`Courts`,f:`Marbury v. Madison (1803)`,
 b:`William Marbury sued for a judicial appointment that was never delivered. The Court ruled that the part of the Judiciary Act of 1789 he relied on was unconstitutional, establishing judicial review.`,
 why:`Chief Justice Marshall gave up a small win (Marbury’s job) to claim a huge power for the Court: deciding what the Constitution means.`,
 ex:`Pairs with Federalist 78. Any question about the courts’ power traces back here.`,
 q:`How did Marshall turn a political loss into a long-term win for the Court?`,
 qa:`He ruled the Court couldn’t give Marbury his commission because the law granting that power was unconstitutional, which established the Court’s power to strike down laws.`,
 clue:`The 1803 case in which the Court struck down part of the Judiciary Act of 1789 and established judicial review.`},
{id:`d-fed78`,u:2,t:`doc`,topic:`Courts`,f:`Federalist No. 78 (Hamilton, 1788)`,
 b:`Hamilton argues the judiciary is the “least dangerous” branch because it has influence over neither “the sword” nor “the purse.” Judges should serve during good behavior (effectively for life) to stay independent, and courts should strike down laws that conflict with the Constitution.`,
 why:`It’s the intellectual foundation for judicial review, later put into practice in Marbury v. Madison.`,
 q:`Why does Hamilton think life tenure matters?`,
 qa:`It frees judges from political pressure so they can protect the Constitution even when their rulings are unpopular.`,
 clue:`Hamilton argues the judiciary is the “least dangerous” branch and defends judicial review and life tenure.`},
{id:`stare-decisis`,u:2,t:`concept`,topic:`Courts`,f:`Stare decisis (precedent)`,
 b:`Latin for “let the decision stand.” Courts generally follow earlier rulings on the same legal question.`,
 why:`It keeps the law stable and predictable. The Court can overturn precedent, as Brown v. Board did to Plessy v. Ferguson and Dobbs did to Roe v. Wade.`,
 ex:`The SCOTUS Comparison FRQ often asks how a precedent applies to a new case.`,
 q:`Give an example of the Supreme Court overturning its own precedent.`,
 qa:`Brown v. Board (1954) overturned Plessy v. Ferguson’s “separate but equal”; Dobbs (2022) overturned Roe v. Wade.`},
{id:`activism`,u:2,t:`concept`,topic:`Courts`,f:`Judicial activism vs. restraint`,
 b:`Judicial activism: judges are willing to strike down laws or overturn precedent to fix what they see as constitutional problems. Judicial restraint: judges defer to the elected branches and to precedent unless a violation is clear.`,
 why:`Neither label belongs to one party. Whether a ruling looks “activist” often depends on whether you like the result.`,
 q:`Is overturning precedent always activism?`,
 qa:`It’s usually labeled that way, but people disagree. Supporters of a reversal often call it correcting a mistake.`,
 clue:`Two judicial philosophies: one willing to strike down laws and overturn precedent, the other deferring to elected branches.`},
{id:`cert`,u:2,t:`concept`,topic:`Courts`,f:`Writ of certiorari (rule of four)`,
 b:`The Supreme Court agrees to hear a case by granting a writ of certiorari. It takes four of the nine justices to grant one.`,
 why:`The Court gets thousands of petitions each year and hears only about 60 cases. Most arrive on appeal from federal appeals courts or state supreme courts.`,
 q:`Roughly how many cases does the Court hear each term?`,
 qa:`About 60, out of several thousand petitions.`,
 clue:`How the Supreme Court agrees to hear a case, which takes four of the nine justices.`},
{id:`opinions`,u:2,t:`concept`,topic:`Courts`,f:`Majority, concurring, and dissenting opinions`,
 b:`Majority opinion: the Court’s ruling and reasoning, which sets precedent. Concurring opinion: agrees with the result for different reasons. Dissenting opinion: disagrees with the result.`,
 why:`Dissents sometimes become future majorities. Justice Harlan’s lone dissent in Plessy (1896) was vindicated by Brown in 1954.`,
 q:`Why write a dissent if it doesn’t change the outcome?`,
 qa:`To lay out reasoning future courts might adopt, to signal disagreement, or to push Congress to act.`,
 clue:`The three kinds of written Supreme Court opinions: the ruling, agreeing for different reasons, and disagreeing.`},
{id:`court-checks`,u:2,t:`concept`,topic:`Courts`,f:`Checks on the courts`,
 b:`The president nominates and the Senate confirms judges. Congress can change the number of justices, limit which cases courts can hear, pass new laws, or propose amendments to reverse rulings. The executive branch decides how to enforce rulings.`,
 why:`Federalist 78 calls courts the “least dangerous” branch because they control neither the sword nor the purse. Their power depends on legitimacy.`,
 q:`How can Congress respond to a Supreme Court ruling it disagrees with?`,
 qa:`Pass a new law (when the ruling interpreted a statute), propose a constitutional amendment, change the Court’s size or jurisdiction, or refuse to fund enforcement.`},
{id:`bureaucracy`,u:2,t:`concept`,topic:`Bureaucracy`,f:`Federal bureaucracy`,
 b:`The departments, agencies, and commissions that carry out federal laws. It includes 15 cabinet departments, independent regulatory agencies (like the FCC), and government corporations (like the U.S. Postal Service).`,
 why:`Congress writes laws broadly, and the bureaucracy fills in the details by writing regulations. That gives unelected officials real power.`,
 q:`Why does Congress give agencies so much discretion?`,
 qa:`Lawmakers lack the time and expertise for technical details, so they delegate rule-making to specialists.`},
{id:`rulemaking`,u:2,t:`concept`,topic:`Bureaucracy`,f:`Discretionary and rule-making authority`,
 b:`Agencies’ power to decide how to carry out laws and to write regulations that have the force of law. Example: the EPA setting pollution limits under the Clean Air Act.`,
 why:`In Loper Bright Enterprises v. Raimondo (2024), the Supreme Court overturned the Chevron doctrine, so courts no longer defer to an agency’s reading of an unclear law. That shifted power from agencies to judges.`,
 q:`Who gained power when Chevron deference ended?`,
 qa:`Federal courts, and arguably Congress, which now needs to write clearer laws. Agencies lost some freedom to interpret statutes.`,
 clue:`Agencies’ power to decide how to carry out laws and to write regulations with the force of law.`},
{id:`iron-triangle`,u:2,t:`concept`,topic:`Bureaucracy`,f:`Iron triangle`,
 b:`A stable, mutually beneficial relationship among a congressional committee, a federal agency, and an interest group in the same policy area.`,
 why:`Example: the Armed Services committees, the Department of Defense, and defense contractors. Critics say these relationships serve insiders over the public. Issue networks are a looser, broader version.`,
 q:`What does each side of the triangle get?`,
 qa:`The interest group gets favorable policy, the committee gets campaign support and expertise, and the agency gets funding and political backing.`},
{id:`oversight`,u:2,t:`concept`,topic:`Bureaucracy`,f:`Congressional oversight`,
 b:`Congress reviews how the executive branch carries out laws by holding hearings, investigating, controlling budgets (the “power of the purse”), and confirming appointees.`,
 q:`What’s Congress’s most powerful oversight tool?`,
 qa:`The power of the purse: it can increase, cut, or attach conditions to an agency’s funding.`,
 clue:`Congress reviewing how the executive branch carries out laws through hearings, investigations, and budgets.`},
{id:`merit`,u:2,t:`concept`,topic:`Bureaucracy`,f:`Patronage vs. merit system`,
 b:`Patronage (the “spoils system”) gave government jobs to political supporters. The Pendleton Civil Service Act (1883) began replacing it with a merit system based on exams and qualifications.`,
 why:`It passed after President Garfield was assassinated by a disappointed office seeker. It made the bureaucracy more professional and less political.`,
 q:`What event pushed Congress to pass the Pendleton Act?`,
 qa:`The 1881 assassination of President James Garfield by a man who had been denied a government job.`,
 clue:`The 1883 change that began replacing the spoils system with hiring based on exams and qualifications.`},

/* ===== UNIT 3 ===== */
{id:`liberties-rights`,u:3,t:`concept`,topic:`Civil liberties`,f:`Civil liberties vs. civil rights`,
 b:`Civil liberties are protections from government interference, mostly in the Bill of Rights (speech, religion, fair trials). Civil rights are protections from unequal treatment, rooted in the 14th Amendment’s Equal Protection Clause.`,
 why:`Mixing these up is one of the most common student mistakes. Liberties = freedom from government. Rights = equal treatment.`,
 q:`Is the right to a lawyer a civil liberty or a civil right?`,
 qa:`A civil liberty: a Sixth Amendment protection against the government.`,
 clue:`The difference between protections from government interference and protections from unequal treatment.`},
{id:`incorporation`,u:3,t:`concept`,topic:`Civil liberties`,f:`Selective incorporation`,
 b:`The process of applying the Bill of Rights to the states, one right at a time, through the 14th Amendment’s Due Process Clause.`,
 why:`The Bill of Rights originally limited only the national government. Incorporation means states can’t violate these rights either. Gideon and McDonald are required incorporation cases.`,
 ex:`Know the clause: the Due Process Clause of the 14th Amendment.`,
 q:`Name two required cases that incorporated a right.`,
 qa:`Gideon v. Wainwright (Sixth Amendment right to counsel) and McDonald v. Chicago (Second Amendment).`},
{id:`establishment`,u:3,t:`concept`,topic:`First Amendment`,f:`Establishment Clause`,
 b:`The First Amendment bars government from establishing an official religion or favoring religion. Jefferson called it a “wall of separation between church and state.”`,
 why:`Engel v. Vitale (1962) used it to ban official school prayer. The Court’s approach has shifted: in Kennedy v. Bremerton (2022) it protected a coach’s personal prayer on the field.`,
 q:`How is Engel v. Vitale different from Kennedy v. Bremerton?`,
 qa:`Engel struck down prayer written and sponsored by the state; Kennedy protected a public employee’s personal prayer, which the Court saw as private religious expression.`,
 clue:`The First Amendment clause that bars government from sponsoring or favoring religion.`},
{id:`c-engel`,u:3,t:`case`,topic:`First Amendment`,f:`Engel v. Vitale (1962)`,
 b:`New York public schools began the day with a short, nondenominational prayer written by state officials. The Court ruled that school-sponsored prayer violates the Establishment Clause, even when it’s voluntary.`,
 why:`Government can’t write or sponsor prayers in public schools. Students can still pray on their own.`,
 q:`The prayer was voluntary and nondenominational. Why was it still unconstitutional?`,
 qa:`The state wrote and sponsored it, which put the government’s support behind religion.`,
 clue:`The Court ruled that a state-written, voluntary prayer in public schools violated the Establishment Clause.`},
{id:`free-exercise`,u:3,t:`concept`,topic:`First Amendment`,f:`Free Exercise Clause`,
 b:`The First Amendment protects people’s right to practice their religion. Government can’t target religious practice, though some general laws still apply to everyone.`,
 why:`Wisconsin v. Yoder (1972) is the required case: Amish families didn’t have to send their children to school past 8th grade.`,
 ex:`When the two religion clauses collide, the exam may ask you to identify the tension.`,
 q:`How can the two religion clauses conflict?`,
 qa:`Accommodating religious practice (free exercise) can look like government favoring religion (establishment).`,
 clue:`The First Amendment clause protecting people’s right to practice their religion, central to the Amish schooling case.`},
{id:`c-yoder`,u:3,t:`case`,topic:`First Amendment`,f:`Wisconsin v. Yoder (1972)`,
 b:`Amish parents refused to send their children to school past 8th grade, violating Wisconsin’s compulsory attendance law. The Court ruled that the Free Exercise Clause outweighed the state’s interest in two more years of schooling.`,
 why:`It shows that religious freedom can override a general state law when the burden on religion is serious.`,
 ex:`Engel and Yoder are both religion cases but different clauses: Engel = Establishment, Yoder = Free Exercise.`,
 q:`Which religion clause does this case involve, and which does Engel involve?`,
 qa:`Yoder: Free Exercise. Engel: Establishment.`,
 clue:`The Court ruled Amish parents didn’t have to send their children to school past 8th grade.`},
{id:`speech-limits`,u:3,t:`concept`,topic:`First Amendment`,f:`Limits on free speech`,
 b:`Speech is protected but not absolute. Unprotected categories include true threats, defamation, obscenity, and incitement to “imminent lawless action” (Brandenburg v. Ohio, 1969).`,
 why:`Schenck’s “clear and present danger” test (1919) was later replaced by Brandenburg’s stricter incitement test, which protects more speech.`,
 hook:`You can criticize the government online. You can’t post a real threat against a specific person.`,
 q:`Which test replaced “clear and present danger,” and does it protect more or less speech?`,
 qa:`Brandenburg’s “imminent lawless action” test. It protects more speech.`},
{id:`c-schenck`,u:3,t:`case`,topic:`First Amendment`,f:`Schenck v. United States (1919)`,
 b:`Charles Schenck mailed leaflets urging men to resist the World War I draft. The Court unanimously upheld his conviction under the Espionage Act, ruling that speech creating a “clear and present danger” can be limited.`,
 why:`Justice Holmes compared it to falsely shouting fire in a crowded theater. The test was later replaced by Brandenburg v. Ohio (1969).`,
 ex:`The lesson: speech isn’t absolute, and context (like wartime) matters.`,
 q:`Would the leaflets likely be protected today? Why?`,
 qa:`Probably yes. Under Brandenburg, speech is protected unless it’s meant to, and likely to, produce imminent lawless action.`,
 clue:`During World War I, the Court upheld a conviction for anti-draft leaflets and created the “clear and present danger” test.`},
{id:`symbolic`,u:3,t:`concept`,topic:`First Amendment`,f:`Symbolic speech`,
 b:`Actions that express a message, such as wearing armbands, burning a flag, or kneeling during the anthem, are protected as speech.`,
 why:`Tinker v. Des Moines (1969) protected students’ armbands. Texas v. Johnson (1989) protected flag burning.`,
 q:`According to Tinker, when can schools limit student speech?`,
 qa:`When it would cause a “substantial disruption” of school activities or invade other students’ rights.`},
{id:`c-tinker`,u:3,t:`case`,topic:`First Amendment`,f:`Tinker v. Des Moines (1969)`,
 b:`Students wore black armbands to school to protest the Vietnam War and were suspended. The Court ruled 7–2 that symbolic speech is protected and that students don’t “shed their constitutional rights to freedom of speech or expression at the schoolhouse gate.”`,
 why:`Schools can limit student speech only if it causes substantial disruption. It’s the case behind most student-speech debates today.`,
 hook:`Thinking of wearing a T-shirt with a political message to school? This is your case.`,
 q:`What would a school need to show to legally ban a political T-shirt?`,
 qa:`That it would cause a substantial disruption of school activities or invade other students’ rights.`,
 clue:`The Court protected students who wore black armbands to school to protest the Vietnam War.`},
{id:`prior-restraint`,u:3,t:`concept`,topic:`First Amendment`,f:`Prior restraint`,
 b:`Government action that blocks publication before it happens. Courts treat it as almost always unconstitutional.`,
 why:`In New York Times Co. v. United States (1971), the government failed to stop newspapers from publishing the Pentagon Papers.`,
 q:`Why is blocking publication treated more harshly than punishment afterward?`,
 qa:`It stops information from ever reaching the public, which is the most direct form of censorship.`},
{id:`c-nyt`,u:3,t:`case`,topic:`First Amendment`,f:`New York Times Co. v. United States (1971)`,
 b:`The Nixon administration tried to stop newspapers from publishing the Pentagon Papers, a classified history of the Vietnam War. The Court ruled 6–3 that the government hadn’t met the heavy burden required for prior restraint.`,
 why:`It strongly protects freedom of the press against censorship before publication.`,
 q:`What is prior restraint?`,
 qa:`Government blocking publication in advance. The Court treats it as presumed unconstitutional.`,
 clue:`The Court refused to stop newspapers from publishing the Pentagon Papers.`},
{id:`fourth`,u:3,t:`concept`,topic:`Rights of the accused`,f:`4th Amendment and the exclusionary rule`,
 b:`The Fourth Amendment protects against unreasonable searches and seizures and generally requires warrants based on probable cause. The exclusionary rule keeps illegally obtained evidence out of trial; Mapp v. Ohio (1961) applied it to the states.`,
 why:`In schools, officials need only “reasonable suspicion” to search students (New Jersey v. T.L.O., 1985). Police generally need a warrant to search a cellphone (Riley v. California, 2014).`,
 hook:`This amendment is behind the rules on searching your locker, car, or phone.`,
 q:`What happens to evidence police find in an illegal search?`,
 qa:`Under the exclusionary rule, it generally can’t be used in court against the defendant.`,
 clue:`Protection against unreasonable searches, plus the rule that keeps illegally obtained evidence out of court.`},
{id:`fifth-sixth`,u:3,t:`concept`,topic:`Rights of the accused`,f:`5th and 6th Amendment rights`,
 ask:`What rights do the 5th and 6th Amendments give someone accused of a crime?`,
 b:`The Fifth Amendment protects against self-incrimination and double jeopardy and guarantees due process. The Sixth guarantees a speedy, public trial, an impartial jury, and the right to a lawyer.`,
