 why:`Miranda v. Arizona (1966) requires police to warn suspects of these rights (“You have the right to remain silent…”). Gideon applied the right to a lawyer to the states.`,
 q:`Which amendment does “You have the right to remain silent” come from?`,
 qa:`The Fifth Amendment (protection against self-incrimination).`,
 clue:`Protection against self-incrimination and double jeopardy, plus the right to a lawyer and a speedy, public trial.`},
{id:`c-gideon`,u:3,t:`case`,topic:`Rights of the accused`,f:`Gideon v. Wainwright (1963)`,
 b:`Clarence Gideon was charged with a felony in Florida, couldn’t afford a lawyer, and was denied one. The Court unanimously ruled that states must provide lawyers to defendants who can’t afford one in felony cases.`,
 why:`It incorporated the Sixth Amendment right to counsel through the 14th Amendment. Gideon wrote his petition by hand from prison, and he was acquitted when retried with a lawyer.`,
 q:`Which amendment was incorporated, and through which clause?`,
 qa:`The Sixth Amendment right to counsel, through the 14th Amendment’s Due Process Clause.`,
 clue:`The Court ruled that states must provide lawyers to felony defendants who can’t afford one.`},
{id:`c-mcdonald`,u:3,t:`case`,topic:`Civil liberties`,f:`McDonald v. Chicago (2010)`,
 b:`Chicago banned handgun ownership. The Court ruled 5–4 that the Second Amendment right to keep and bear arms applies to state and local governments through the 14th Amendment’s Due Process Clause.`,
 why:`It built on D.C. v. Heller (2008), which recognized an individual right to bear arms. A clear example of selective incorporation.`,
 q:`Why did this case need to be decided after Heller?`,
 qa:`Heller involved Washington, D.C., a federal district, so it didn’t settle whether the Second Amendment limited states and cities.`,
 clue:`The Court ruled the Second Amendment applies to state and local governments, striking down a city handgun ban.`},
{id:`privacy`,u:3,t:`context`,topic:`Civil liberties`,f:`Right to privacy: Roe and Dobbs`,
 ask:`Explain the right to privacy and what happened to Roe v. Wade.`,
 b:`The Constitution never says “privacy,” but Griswold v. Connecticut (1965) found an implied right. Roe v. Wade (1973) extended it to abortion. Dobbs v. Jackson Women’s Health Organization (2022) overturned Roe and returned abortion regulation to the states.`,
 why:`Roe is no longer a required case, but it still works as a non-required case on the SCOTUS Comparison FRQ and as a clear example of the Court overturning precedent.`,
 ex:`Use it for stare decisis and federalism examples.`,
 q:`After Dobbs, who decides abortion policy?`,
 qa:`Mostly the states, through state laws and ballot measures.`,
 clue:`An implied constitutional right, extended to abortion in 1973; that ruling was overturned in 2022.`},
{id:`equal-protection`,u:3,t:`concept`,topic:`Civil rights`,f:`Equal Protection Clause`,
 b:`The 14th Amendment (1868) says no state may “deny to any person within its jurisdiction the equal protection of the laws.”`,
 why:`It’s the constitutional backbone of civil rights. Brown v. Board, Baker v. Carr, and Shaw v. Reno all rest on it.`,
 ex:`If a question involves discrimination by a state, think of this clause first.`,
 q:`Name two required cases decided under this clause.`,
 qa:`Any two of Brown v. Board, Baker v. Carr, and Shaw v. Reno.`,
 clue:`The 14th Amendment clause that bars states from treating people unequally under the law.`},
{id:`c-brown`,u:3,t:`case`,topic:`Civil rights`,f:`Brown v. Board of Education (1954)`,
 b:`Black students were required to attend segregated schools. The Court ruled unanimously that “separate educational facilities are inherently unequal,” violating the Equal Protection Clause and overturning Plessy v. Ferguson (1896).`,
 why:`A landmark for civil rights and an example of the NAACP using the courts; Thurgood Marshall argued it. Desegregation was slow because enforcement depended on the other branches.`,
 ex:`Use it for Equal Protection, stare decisis (Plessy overturned), and the limits of judicial power (enforcement).`,
 q:`Why did desegregation move slowly after this ruling?`,
 qa:`Courts can’t enforce their own rulings. States resisted, and real change needed executive enforcement and laws like the Civil Rights Act of 1964.`,
 clue:`The Court ruled that “separate educational facilities are inherently unequal,” overturning Plessy v. Ferguson.`},
{id:`d-birmingham`,u:3,t:`doc`,topic:`Civil rights`,f:`Letter from Birmingham Jail (King, 1963)`,
 b:`Written while King was jailed for protesting segregation. He defends nonviolent civil disobedience, argues people have a moral duty to break unjust laws, and criticizes white moderates who urged patience. “Injustice anywhere is a threat to justice everywhere.”`,
 why:`It explains why the civil rights movement used direct action instead of waiting for courts or legislatures, and it helped build support for the Civil Rights Act of 1964.`,
 ex:`Strong Argument Essay evidence on civil rights, social movements, and participation.`,
 q:`How does King tell a just law from an unjust one?`,
 qa:`A just law matches moral law and applies equally. An unjust law degrades people, binds a minority but not the majority that made it, or was passed by a body the minority couldn’t vote for.`,
 clue:`King defends nonviolent civil disobedience and the duty to break unjust laws.`},
{id:`cra64`,u:3,t:`concept`,topic:`Civil rights`,f:`Civil Rights Act of 1964`,
 b:`Banned discrimination based on race, color, religion, sex, or national origin in public accommodations (hotels, restaurants), in employment (Title VII), and in federally funded programs.`,
 why:`It passed after sustained pressure from the civil rights movement, including the Birmingham campaign and the March on Washington. Congress relied on its Commerce Clause power, and the Court upheld it.`,
 hook:`Title VII is why an employer can’t refuse to hire you because of your race or sex. In Bostock v. Clayton County (2020), the Court ruled it also protects gay and transgender employees.`,
 q:`Which constitutional power did Congress rely on to ban discrimination by private businesses?`,
 qa:`The Commerce Clause, upheld in Heart of Atlanta Motel v. United States (1964).`,
 clue:`The 1964 law banning discrimination in hotels, restaurants, and employment.`},
{id:`vra`,u:3,t:`concept`,topic:`Civil rights`,f:`Voting Rights Act of 1965`,
 b:`Banned literacy tests and other discriminatory voting practices, and required certain states with histories of discrimination to get federal approval (“preclearance”) before changing election rules.`,
 why:`Black voter registration in the South rose sharply. In Shelby County v. Holder (2013), the Court struck down the formula that decided which places needed preclearance.`,
 q:`What did Shelby County v. Holder change?`,
 qa:`It struck down the coverage formula, so places that had needed preclearance no longer have to get federal approval for election changes.`,
 clue:`The 1965 law that banned literacy tests and required federal approval for election changes in some states.`},
{id:`title-ix`,u:3,t:`concept`,topic:`Civil rights`,f:`Title IX (1972)`,
 b:`Bans sex discrimination in any education program or activity that receives federal money.`,
 why:`It transformed girls’ and women’s sports and applies to admissions, harassment, and athletics at schools and colleges.`,
 hook:`If your school’s girls’ teams get fair access to fields and gyms, this law is a big reason.`,
 q:`How does this law use the same strategy as the drinking-age highway funds?`,
 qa:`Schools must follow it to keep receiving federal money. That’s a condition of aid.`,
 clue:`The 1972 law banning sex discrimination in federally funded education programs.`},
{id:`ada`,u:3,t:`bonus`,topic:`Civil rights`,f:`Americans with Disabilities Act (1990)`,
 b:`Bans discrimination against people with disabilities in employment, state and local government services, and public accommodations, and requires reasonable accommodations and accessibility.`,
 why:`Disability activists won it through years of protest, including the 1977 Section 504 sit-ins and the 1990 “Capitol Crawl,” when activists climbed the Capitol steps without their wheelchairs or crutches. A clear case of a social movement producing a civil rights law.`,
 hook:`The 504 plans and testing accommodations many students use come from this movement and from Section 504 of the Rehabilitation Act of 1973.`,
 ex:`Not named in the course framework, but a strong outside example for civil rights and unfunded-mandate questions.`,
 q:`How is the ADA an example of both civil rights policy and federalism?`,
 qa:`It guarantees equal treatment for people with disabilities (civil rights) and requires states and localities to comply largely at their own cost (an unfunded mandate).`,
 clue:`The 1990 law banning disability discrimination and requiring reasonable accommodations.`},
{id:`affirmative`,u:3,t:`concept`,topic:`Civil rights`,f:`Affirmative action and SFFA v. Harvard (2023)`,
 ask:`What is affirmative action, and what did the Supreme Court decide about it in 2023?`,
 b:`Affirmative action gave some weight to race or sex to make up for past discrimination. In Students for Fair Admissions v. Harvard (2023), the Court ruled that race-conscious college admissions violate the Equal Protection Clause and Title VI of the Civil Rights Act.`,
 why:`It ended race as an admissions factor at nearly all colleges. Applicants can still write about how race has affected their lives.`,
 hook:`This decision shapes the college applications you’re writing this year.`,
 ex:`A recent example for Equal Protection questions and for showing how the Court’s interpretation changes.`,
 q:`Can applicants still discuss race in their college essays?`,
 qa:`Yes. The Court said applicants may describe how race affected their lives, as long as colleges judge the individual’s experience and not race itself.`,
 clue:`The 2023 ruling that ended race-conscious college admissions.`},

/* ===== UNIT 4 ===== */
{id:`socialization`,u:4,t:`concept`,topic:`Beliefs & socialization`,f:`Political socialization`,
 b:`The process through which people develop political beliefs and values. Family is usually the strongest influence, along with school, peers, media, religion, and major events.`,
 hook:`If you lean the same way politically as your parents, this is why. College and first jobs often shift those views.`,
 q:`Name the most influential source of political beliefs and two others.`,
 qa:`Family, plus any two of school, peers, media, religion, or community.`,
 clue:`The process through which people develop political beliefs, usually starting with family.`},
{id:`generational`,u:4,t:`concept`,topic:`Beliefs & socialization`,f:`Generational and life-cycle effects`,
 b:`Generational effects come from experiences an age group shares (for example, 9/11 or the COVID-19 pandemic). Life-cycle effects are changes in views as people age and their priorities shift.`,
 q:`A 22-year-old and a 65-year-old disagree about Social Security. Which effect might explain it?`,
 qa:`A life-cycle effect: older people rely more on Social Security, so their priorities differ.`,
 clue:`Two ways age shapes political views: experiences a cohort shares, and priorities that change as people get older.`},
{id:`core-values`,u:4,t:`concept`,topic:`Beliefs & socialization`,f:`Core American political values`,
 b:`Widely shared values: individualism, equality of opportunity, free enterprise, rule of law, and limited government.`,
 why:`Americans broadly agree on these values but disagree on how to balance them, which explains much of the conflict between the parties.`,
 q:`How can individualism and equality of opportunity conflict?`,
 qa:`Policies that expand opportunity (like programs paid for by taxes) can limit individual choices or property.`,
 clue:`Individualism, equality of opportunity, free enterprise, rule of law, and limited government.`},
{id:`polling`,u:4,t:`concept`,topic:`Polling`,f:`Scientific polling and margin of error`,
 b:`A reliable poll uses a random, representative sample, neutral question wording, and a large enough sample. The margin of error (often ±3 points) shows the range where the true result probably falls.`,
 why:`If two candidates’ numbers are within the margin of error, the race is a statistical tie.`,
 ex:`The Quantitative Analysis FRQ often includes poll data. Check sample size and question wording.`,
 q:`Candidate A leads 48% to 46%, with a margin of error of ±3. Who’s winning?`,
 qa:`Neither, statistically. The lead is within the margin of error.`,
 clue:`What makes a survey reliable, including random sampling and the ± range around the result.`},
{id:`ideologies`,u:4,t:`concept`,topic:`Ideology & policy`,f:`Liberal, conservative, libertarian`,
 ask:`How do liberals, conservatives, and libertarians differ on the role of government?`,
 b:`Liberals generally favor more government action on economic issues and less on personal ones. Conservatives generally favor less economic regulation and more emphasis on tradition and order. Libertarians want minimal government in both economic and personal life.`,
 q:`Where do libertarians agree with liberals, and where with conservatives?`,
 qa:`With liberals on limiting government in personal choices; with conservatives on limiting government in the economy.`,
 clue:`Three ideologies that differ on how much government should do in the economy and in personal life.`},
{id:`fiscal-monetary`,u:4,t:`concept`,topic:`Ideology & policy`,f:`Fiscal vs. monetary policy`,
 b:`Fiscal policy is taxing and spending, decided by Congress and the president. Monetary policy is managing the money supply and interest rates, run by the independent Federal Reserve.`,
 why:`The Fed’s independence is meant to keep short-term political pressure out of interest-rate decisions.`,
 hook:`When the Fed raises interest rates, car loans and student loans get more expensive.`,
 q:`Which policy is controlled by elected officials, and which by an independent agency?`,
 qa:`Fiscal: Congress and the president. Monetary: the Federal Reserve.`,
 clue:`Taxing and spending by elected officials, versus interest rates managed by an independent agency.`},
{id:`keynes-supply`,u:4,t:`concept`,topic:`Ideology & policy`,f:`Keynesian vs. supply-side economics`,
 b:`Keynesian economics says government should increase spending in downturns to boost demand. Supply-side economics says cutting taxes and regulations encourages investment and growth.`,
 why:`Liberals tend to favor Keynesian approaches; conservatives tend to favor supply-side approaches.`,
 q:`In a recession, what would each side recommend?`,
 qa:`Keynesian: more government spending, sometimes tax rebates. Supply-side: tax cuts, especially on business and investment, and less regulation.`,
 clue:`Two economic approaches: boost government spending in downturns, or cut taxes and regulation to spur investment.`},
{id:`d-wealth`,u:4,t:`doc`,isNew:true,topic:`Ideology & policy`,f:`The Wealth of Nations (Adam Smith, 1776)`,
 b:`Smith argues that free markets, competition, and the division of labor create prosperity. When people pursue their own interests, an “invisible hand” tends to benefit society. Government’s role is limited to defense, justice, and certain public works and institutions.`,
 why:`Its ideas shape free-enterprise values and the debate over how much government should regulate the economy. It was published the same year as the Declaration.`,
 ex:`New to the required list for 2026–27 (its core principles). Use it in questions about economic ideology and free enterprise.`,
 q:`What would Smith say about government setting prices for most goods?`,
 qa:`He’d oppose it, arguing that competition in free markets sets prices better than government can.`,
 clue:`Adam Smith’s argument that free markets and an “invisible hand” create prosperity.`},

/* ===== UNIT 5 ===== */
{id:`voting-amendments`,u:5,t:`concept`,topic:`Voting`,f:`Voting rights amendments`,
 ask:`Name the four amendments that expanded voting rights and what each one did.`,
 b:`15th (1870): no denying the vote based on race. 19th (1920): women’s suffrage. 24th (1964): bans poll taxes in federal elections. 26th (1971): lowers the voting age to 18.`,
 hook:`The 26th Amendment is yours. It passed during the Vietnam War, when 18-year-olds could be drafted but couldn’t vote.`,
 q:`Which amendment lets you vote at 18, and what was the argument for it?`,
 qa:`The 26th. If 18-year-olds could be drafted to fight in Vietnam, they should be able to vote.`,
 clue:`The 15th, 19th, 24th, and 26th Amendments.`},
{id:`voter-models`,u:5,t:`concept`,topic:`Voting`,f:`Models of voting behavior`,
 ask:`Name and explain the four models of voting behavior.`,
 b:`Rational choice: voting for what serves your own interests. Retrospective: judging incumbents on past performance. Prospective: voting on predictions of future performance. Party-line: voting for one party’s candidates all the way down the ballot.`,
 q:`“I’m voting against the president’s party because the economy got worse.” Which model is that?`,
 qa:`Retrospective voting.`,
 clue:`Rational choice, retrospective, prospective, and party-line.`},
{id:`turnout`,u:5,t:`concept`,topic:`Voting`,f:`Voter turnout`,
 b:`Turnout is higher among people who are older, more educated, wealthier, and more interested in politics. Rules matter too: registration deadlines, voter ID laws, early and mail voting, and whether it’s a presidential or midterm year.`,
 why:`Young voters have the lowest turnout of any age group, so campaigns often spend less effort on them.`,
 hook:`Many states let 16- and 17-year-olds pre-register so they’re ready to vote on their 18th birthday.`,
 q:`Why is turnout lower in midterm elections?`,
 qa:`There’s no presidential race to drive attention, media coverage is lighter, and many voters feel less is at stake.`,
 clue:`Which groups are most likely to vote, and how registration rules and the type of election affect participation.`},
{id:`linkage`,u:5,t:`concept`,topic:`Parties`,f:`Linkage institutions`,
 b:`Channels that connect people to government: political parties, interest groups, elections, and the media.`,
 q:`How does an interest group act as one of these?`,
 qa:`It gathers people’s shared concerns and carries them to officials through lobbying, testimony, and campaigns.`,
 clue:`The channels that connect people to government: parties, interest groups, elections, and the media.`},
{id:`parties`,u:5,t:`concept`,topic:`Parties`,f:`Party functions and realignment`,
 b:`Parties recruit candidates, mobilize voters, organize government, and simplify choices with a party label. A realignment is a lasting shift in which groups support which party, often marked by a critical election such as 1932.`,
 why:`Parties adapt to change, such as the white South’s shift from Democratic to Republican from the 1960s on.`,
 q:`What’s the difference between realignment and dealignment?`,
 qa:`Realignment: groups switch party loyalties. Dealignment: people drop party loyalty altogether and call themselves independents.`,
 clue:`What parties do (recruit, mobilize, organize), and the lasting coalition shifts marked by a critical election.`},
{id:`two-party`,u:5,t:`concept`,topic:`Parties`,f:`Winner-take-all and third parties`,
 b:`Most U.S. elections use single-member districts with winner-take-all (plurality) rules, which push the country toward two major parties. Third parties rarely win but can act as spoilers and push major parties to adopt their ideas.`,
 why:`Ballot-access laws and debate rules also make it hard for third parties to compete.`,
 q:`Why do third parties rarely win in the U.S.?`,
 qa:`Only the top vote-getter wins, so voters fear “wasting” a vote; ballot-access and debate rules add more barriers.`,
 clue:`Why single-member, plurality districts push the U.S. toward two major parties.`},
{id:`interest-groups`,u:5,t:`concept`,topic:`Interest groups & money`,f:`Interest groups and the free-rider problem`,
 b:`Organized groups that try to influence policy by lobbying, filing amicus briefs, donating through PACs, and mobilizing members. The free-rider problem: people can benefit from a group’s work without joining or paying.`,
 q:`Give an example of the free-rider problem.`,
 qa:`A worker who benefits from a union contract without joining, or someone who enjoys clean air won by environmental groups without donating.`,
 clue:`Organized groups that lobby and file amicus briefs, and the problem of people benefiting without joining.`},
{id:`superpac`,u:5,t:`concept`,topic:`Interest groups & money`,f:`PACs and super PACs`,
 b:`A PAC collects contributions and gives limited amounts directly to candidates. A super PAC can raise and spend unlimited amounts but can’t coordinate with a candidate’s campaign.`,
 why:`Super PACs grew out of Citizens United v. FEC and a 2010 appeals court ruling, SpeechNow.org v. FEC.`,
 q:`What’s the one thing a super PAC can’t do?`,
 qa:`Coordinate with a candidate’s campaign or give money directly to it.`,
 clue:`Two kinds of groups that spend on elections: one gives limited amounts to candidates, the other spends unlimited amounts independently.`},
{id:`bcra`,u:5,t:`concept`,topic:`Interest groups & money`,f:`Bipartisan Campaign Reform Act (2002)`,
 b:`Also called McCain-Feingold. It banned “soft money” donations to national parties and restricted ads paid for by corporations and unions close to elections. Citizens United later struck down the limits on independent spending.`,
 q:`Which part of this law did Citizens United strike down?`,
 qa:`The ban on corporations and unions spending their own money on independent political ads close to elections.`,
 clue:`The 2002 law, also called McCain-Feingold, that banned soft money donations to national parties.`},
{id:`c-citizens`,u:5,t:`case`,topic:`Interest groups & money`,f:`Citizens United v. FEC (2010)`,
 b:`A nonprofit group wanted to air a film criticizing Hillary Clinton close to the 2008 primaries. The Court ruled 5–4 that corporations and unions can spend unlimited amounts on independent political communications, because political spending is protected speech.`,
 why:`It led to the rise of super PACs and far more outside spending in elections.`,
 ex:`First Amendment + campaign finance. Pairs with questions about interest groups, PACs, and BCRA.`,
 q:`Does this ruling let corporations give unlimited money directly to candidates?`,
 qa:`No. Direct contributions are still limited. It allows unlimited independent spending that isn’t coordinated with campaigns.`,
 clue:`The Court ruled corporations and unions may spend unlimited amounts on independent political ads.`},
{id:`primaries`,u:5,t:`concept`,topic:`Elections`,f:`Primaries and caucuses`,
 b:`Primaries let voters choose a party’s nominees. Closed primaries allow only party members; open primaries let any registered voter take part. Caucuses are meetings where party members choose candidates.`,
 why:`Primary voters tend to be more ideological than general-election voters, which can pull candidates toward the extremes.`,
 q:`Why might primaries produce more extreme candidates?`,
 qa:`Primary voters are fewer and more partisan, so candidates appeal to the party base.`,
 clue:`How parties choose nominees: open or closed elections, or meetings of party members.`},
{id:`electoral-college`,u:5,t:`concept`,topic:`Elections`,f:`Electoral College`,
 b:`538 electors (one for each House seat and Senate seat, plus 3 for D.C.). A candidate needs 270 to win. Most states give all their electors to the statewide winner; Maine and Nebraska split theirs by district.`,
 why:`A candidate can win the presidency while losing the national popular vote, as in 2000 and 2016. Campaigns focus on swing states.`,
 q:`Why do candidates spend most of their time in a few states?`,
 qa:`Winner-take-all rules mean only competitive swing states are likely to change the outcome.`,
 clue:`538 votes, 270 to win, awarded mostly winner-take-all by state.`},
{id:`incumbency`,u:5,t:`concept`,topic:`Elections`,f:`Incumbency advantage`,
 b:`Officeholders running for reelection usually win; House incumbents often win more than 90% of the time. Name recognition, fundraising, help with constituents’ problems (casework), and friendly district lines all help.`,
 q:`Name two sources of this advantage.`,
 qa:`Any two: name recognition, fundraising, free mail to constituents (franking), casework, media coverage, gerrymandered districts.`,
 clue:`Why officeholders running for reelection usually win.`},
{id:`media`,u:5,t:`concept`,topic:`Media`,f:`Agenda-setting and horse-race coverage`,
 b:`The media sets the agenda by choosing which issues get covered (gatekeeping). Horse-race journalism focuses on who’s ahead in the polls rather than on policy.`,
 why:`Social media and partisan outlets create echo chambers that can deepen polarization. Fewer people share the same news sources than in the past.`,
 hook:`Your feed decides much of what you see. That’s agenda-setting by algorithm.`,
 q:`How can social media increase political polarization?`,
 qa:`Algorithms show people content they already agree with, which reinforces their views and limits exposure to other perspectives.`,
 clue:`How news outlets decide which issues get attention, and their focus on who’s ahead in the polls.`},
{id:`social-movements`,u:5,t:`concept`,topic:`Media`,f:`Social movements`,
 b:`Large, informal groups working for change through protests, boycotts, civil disobedience, and public pressure, such as the civil rights, women’s rights, disability rights, and LGBTQ+ rights movements.`,
 why:`Movements often push issues onto the agenda before parties or Congress act. Letter from Birmingham Jail defends their tactics.`,
 q:`Give one example of a social movement leading to a federal law.`,
 qa:`The civil rights movement → Civil Rights Act of 1964 and Voting Rights Act of 1965; the disability rights movement → the ADA (1990).`}
];
CARDS.forEach((c,i)=>{c.n=i+1;});
const BY_ID = {}; CARDS.forEach(c=>{BY_ID[c.id]=c;});
const TOTAL = CARDS.length;

/* ---------------------------------------------------------------
   Storage (this browser only; the page works without it)
---------------------------------------------------------------- */
const KEY = `apgov-flashcards-v1`;
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ const d = JSON.parse(raw); return {status:d.status||{}, sessions:d.sessions||[], prefs:d.prefs||{}}; } }catch(e){}
  return {status:{}, sessions:[], prefs:{}};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
let store = load();

/* ---------------------------------------------------------------
   Helpers
---------------------------------------------------------------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s).replace(/&/g,`&amp;`).replace(/</g,`&lt;`).replace(/>/g,`&gt;`).replace(/"/g,`&quot;`);
function shuffleArr(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function announce(msg){ const l=$(`#live`); l.textContent=``; setTimeout(()=>{l.textContent=msg;},30); }
function fmtDate(ts){ try{ return new Date(ts).toLocaleDateString(`en-US`,{month:`short`,day:`numeric`}); }catch(e){ return ``; } }
function pct(a,b){ return b ? Math.round(a/b*100) : 0; }

const DECKS = [
  {key:`all`, label:`All cards`, test:()=>true},
  {key:`u1`, label:`Unit 1 · Foundations`, test:c=>c.u===1},
  {key:`u2`, label:`Unit 2 · Branches`, test:c=>c.u===2},
  {key:`u3`, label:`Unit 3 · Liberties & Rights`, test:c=>c.u===3},
  {key:`u4`, label:`Unit 4 · Ideologies`, test:c=>c.u===4},
  {key:`u5`, label:`Unit 5 · Participation`, test:c=>c.u===5},
  {key:`cases`, label:`Required cases`, test:c=>c.t===`case`},
  {key:`docs`, label:`Foundational docs`, test:c=>c.t===`doc`},
  {key:`learning`, label:`Still learning`, test:c=>store.status[c.id]===`learning`}
];
function deckOf(key){ return DECKS.find(d=>d.key===key) || DECKS[0]; }
function deckCards(key){ return CARDS.filter(deckOf(key).test); }
function chipsHTML(active, scope){
  return `<div class="deckbar" role="group" aria-label="Choose a deck">` + DECKS.map(d=>{
    const n = deckCards(d.key).length;
    return `<button type="button" class="chip" data-scope="${scope}" data-deck="${d.key}" aria-pressed="${d.key===active}" ${n===0?`disabled`:``}>${esc(d.label)} <span class="count">${n}</span></button>`;
  }).join(``) + `</div>`;
}
function badgeText(c){
  if(c.t===`case`) return `Required case`;
  if(c.t===`doc`) return c.isNew ? `Foundational document · New for 2026–27` : `Foundational document`;
  if(c.t===`context`) return `Context · not a required case`;
  if(c.t===`bonus`) return `Bonus example`;
  return ``;
}
function badgeHTML(c){ const t=badgeText(c); return t ? `<span class="badge${c.isNew?` new`:``}">${esc(t)}</span>` : `<span></span>`; }
function eyebrow(c){ return `Unit ${c.u} · ${c.topic}`; }

/* ---------------------------------------------------------------
   Preferences: text size + animation
---------------------------------------------------------------- */
const SIZES = [`Standard`,`Large`,`Extra large`];
function applyPrefs(){
  const size = store.prefs.size || 0;
  document.documentElement.dataset.size = String(size);
  $(`#size-btn`).textContent = `Text size: ${SIZES[size]}`;
  let motion = store.prefs.motion;
  if(motion===undefined){ motion = !(window.matchMedia && matchMedia(`(prefers-reduced-motion: reduce)`).matches); }
  document.documentElement.dataset.motion = motion ? `on` : `off`;
  $(`#motion-btn`).textContent = `Card animation: ${motion?`On`:`Off`}`;
  $(`#motion-btn`).setAttribute(`aria-pressed`, String(motion));
}
$(`#size-btn`).addEventListener(`click`,()=>{ store.prefs.size = ((store.prefs.size||0)+1)%3; save(); applyPrefs(); });
$(`#motion-btn`).addEventListener(`click`,()=>{ const on = document.documentElement.dataset.motion===`on`; store.prefs.motion = !on; save(); applyPrefs(); });

/* ---------------------------------------------------------------
   STUDY
---------------------------------------------------------------- */
const S = { view:`study`, deck:`all`, shuffle:false, queue:[], pos:0, flipped:false, done:false, resetArmed:false };
function buildQueue(){
  const ids = deckCards(S.deck).map(c=>c.id);
  if(S.shuffle) shuffleArr(ids);
  S.queue = ids; S.pos = 0; S.flipped = false; S.done = ids.length===0;
}
function masteryHTML(){
  const cards = deckCards(S.deck);
  let k=0,l=0; cards.forEach(c=>{ const s=store.status[c.id]; if(s===`known`) k++; else if(s===`learning`) l++; });
  const n = cards.length - k - l;
  const seg = [[k,`good-bg`],[l,`warn-bg`],[n,`new-bg`]].filter(x=>x[0]>0).map(x=>`<span class="${x[1]}" style="flex-grow:${x[0]}"></span>`).join(``);
  return `<div class="mastery">
    <div class="seg" role="img" aria-label="Deck progress: ${k} known, ${l} still learning, ${n} new">${seg}</div>
    <ul class="legend" aria-hidden="true">
      <li><span class="dot good-bg"></span>Known <b>${k}</b></li>
      <li><span class="dot warn-bg"></span>Still learning <b>${l}</b></li>
      <li><span class="dot new-bg"></span>New <b>${n}</b></li>
    </ul></div>`;
}
function frontHTML(c){
  return `<div class="face front" id="face-front">
    <div class="card-top"><span>${esc(eyebrow(c))}</span><span class="cardno tnum">No. ${String(c.n).padStart(3,`0`)} of ${TOTAL}</span></div>
    <div class="ruled"><p class="term">${esc(c.f)}</p></div>
    <div class="card-foot">${badgeHTML(c)}<span class="hint">Tap to flip</span></div>
  </div>`;
}
function backHTML(c){
  const notes = [[`Why it matters`,c.why],[`Real-life hook`,c.hook],[`On the exam`,c.ex]].filter(x=>x[1]);
  return `<div class="face back" id="face-back">
    <div class="card-top"><span class="back-term">${esc(c.f)}</span><span class="cardno tnum">Unit ${c.u}</span></div>
    <p class="def">${esc(c.b)}</p>
    ${notes.length?`<dl class="notes">${notes.map(x=>`<div><dt>${x[0]}</dt><dd>${esc(x[1])}</dd></div>`).join(``)}</dl>`:``}
  </div>`;
}
function renderStudy(focusDeck){
  const el = $(`#view-study`);
  if(!S.queue.length && !S.done) buildQueue();
  el.innerHTML = `
    ${chipsHTML(S.deck,`study`)}
    <div class="studyhead" id="studyhead"></div>
    <div id="study-body"></div>
    <div class="study-foot">
      <label class="check" for="shuffle"><input type="checkbox" id="shuffle" ${S.shuffle?`checked`:``}> Shuffle this deck</label>
      <button type="button" class="link" id="reset-deck">Reset progress for this deck</button>
    </div>
    <p class="keys">Keyboard: <kbd>Space</kbd> flip · <kbd>←</kbd> <kbd>→</kbd> move · <kbd>1</kbd> still learning · <kbd>2</kbd> got it</p>`;
  el.querySelectorAll(`.chip`).forEach(b=>b.addEventListener(`click`,()=>{ S.deck=b.dataset.deck; buildQueue(); renderStudy(b.dataset.deck); }));
  $(`#shuffle`).addEventListener(`change`,e=>{ S.shuffle=e.target.checked; buildQueue(); renderStudy(); $(`#shuffle`).focus(); });
  $(`#reset-deck`).addEventListener(`click`,e=>{
    const btn=e.currentTarget;
    if(!S.resetArmed){ S.resetArmed=true; btn.textContent=`Click again to reset ${deckCards(S.deck).length} cards`; setTimeout(()=>{ S.resetArmed=false; if(document.body.contains(btn)) btn.textContent=`Reset progress for this deck`; },4000); return; }
    S.resetArmed=false; deckCards(S.deck).forEach(c=>{ delete store.status[c.id]; }); save(); buildQueue(); renderStudy(); announce(`Progress reset for this deck.`);
  });
  if(S.done) renderStudyDone(); else renderCardShell();
  if(focusDeck){ const f=el.querySelector(`.chip[data-deck="${focusDeck}"]`); if(f) f.focus(); }
}
function renderCardShell(){
  $(`#study-body`).innerHTML = `
    <div class="scene"><div class="card" id="card" role="button" tabindex="0" aria-describedby="card-help"><div class="card-inner" id="card-inner"></div></div></div>
    <p id="card-help" class="sr-only">Press Space or Enter to flip. Left and right arrows move between cards. Press 1 for still learning or 2 for got it.</p>
    <div class="controls">
      <button type="button" class="btn prev" id="prev">← Previous</button>
      <button type="button" class="btn primary flip" id="flip">Show answer</button>
      <button type="button" class="btn next" id="next">Next →</button>
    </div>
    <div class="rate" role="group" aria-label="How well do you know this card?">
      <button type="button" class="btn" id="mark-learning"><span class="dot warn-bg" aria-hidden="true"></span>Still learning <kbd>1</kbd></button>
      <button type="button" class="btn" id="mark-known"><span class="dot good-bg" aria-hidden="true"></span>Got it <kbd>2</kbd></button>
    </div>`;
  $(`#card`).addEventListener(`click`, flip);
  $(`#flip`).addEventListener(`click`, flip);
  $(`#prev`).addEventListener(`click`, ()=>go(-1));
  $(`#next`).addEventListener(`click`, ()=>go(1));
  $(`#mark-learning`).addEventListener(`click`, ()=>rate(`learning`));
  $(`#mark-known`).addEventListener(`click`, ()=>rate(`known`));
  updateCard();
}
function updateCard(){
  const c = BY_ID[S.queue[S.pos]]; if(!c) return;
  const card=$(`#card`), inner=$(`#card-inner`);
  card.classList.add(`no-anim`);
  card.classList.toggle(`flipped`, S.flipped);
  inner.innerHTML = frontHTML(c) + backHTML(c);
  void inner.offsetWidth;
  card.classList.remove(`no-anim`);
  syncFaces();
  $(`#studyhead`).innerHTML = `<p class="pos"><span class="tnum">Card ${S.pos+1} of ${S.queue.length}</span> <span class="muted">· ${esc(deckOf(S.deck).label)}</span></p>` + masteryHTML();
  $(`#prev`).disabled = S.pos===0;
  $(`#next`).disabled = S.pos>=S.queue.length-1;
}
function syncFaces(){
  const c = BY_ID[S.queue[S.pos]];
  const front=$(`#face-front`), back=$(`#face-back`);
  if(front) front.setAttribute(`aria-hidden`, String(S.flipped));
  if(back) back.setAttribute(`aria-hidden`, String(!S.flipped));
  $(`#flip`).textContent = S.flipped ? `Show question` : `Show answer`;
  $(`#card`).setAttribute(`aria-label`, `${c.f}. ${S.flipped?`Answer side`:`Question side`}. Card ${S.pos+1} of ${S.queue.length}.`);
}
function flip(){ if(S.done) return; S.flipped=!S.flipped; $(`#card`).classList.toggle(`flipped`, S.flipped); syncFaces(); }
function go(d){ if(S.done) return; const p=S.pos+d; if(p<0||p>=S.queue.length) return; S.pos=p; S.flipped=false; updateCard(); }
function rate(status){
  if(S.done) return;
  const id=S.queue[S.pos];
  store.status[id]=status; save();
  if(status===`learning` && S.queue.indexOf(id,S.pos+1)===-1){
    S.queue.splice(Math.min(S.pos+5,S.queue.length),0,id);
  }
  announce(status===`known`?`Marked got it.`:`Marked still learning. It will come back soon.`);
  if(S.pos<S.queue.length-1){ S.pos++; S.flipped=false; updateCard(); }
  else { S.done=true; renderStudyDone(); }
}
function renderStudyDone(){
  const cards=deckCards(S.deck);
  const learning = cards.filter(c=>store.status[c.id]===`learning`).length;
  const known = cards.filter(c=>store.status[c.id]===`known`).length;
  $(`#studyhead`).innerHTML = `<p class="pos">Deck complete <span class="muted">· ${esc(deckOf(S.deck).label)}</span></p>` + masteryHTML();
  $(`#study-body`).innerHTML = `<div class="panel stack">
    <h2>${cards.length ? `You went through the whole deck.` : `This deck is empty.`}</h2>
    <p class="lede">${cards.length ? `${known} of ${cards.length} cards are marked “Got it.” ${learning ? `${learning} still need work, and they’re waiting in the Still learning deck.` : `Nothing is marked Still learning.`}` : `Mark cards “Still learning” while you study and they’ll collect here.`}</p>
    <div class="row-btns">
      ${learning?`<button type="button" class="btn primary" id="go-learning">Study the ${learning} still learning</button>`:``}
      <button type="button" class="btn" id="restart">Start this deck over</button>
      <a class="btn" href="#quiz">Take a quiz</a>
    </div></div>`;
  const gl=$(`#go-learning`); if(gl) gl.addEventListener(`click`,()=>{ S.deck=`learning`; buildQueue(); renderStudy(`learning`); });
  $(`#restart`).addEventListener(`click`,()=>{ buildQueue(); renderStudy(); });
}

/* ---------------------------------------------------------------
   QUIZ (self-test, multiple choice)
---------------------------------------------------------------- */
const TIMERS = [{v:0,label:`Off`},{v:87,label:`AP pace · 87 s`},{v:131,label:`Time and a half · 131 s`},{v:175,label:`Double time · 175 s`}];
const Q = { phase:`setup`, deck:`all`, count:10, timer:0, items:[], i:0, score:0, answered:false, tick:null, deadline:0 };
function familyOf(c){ return (c.t===`case`||c.t===`doc`) ? c.t : `concept`; }
function promptFor(c){ const f=familyOf(c); return f===`case` ? `Which required Supreme Court case is this?` : f===`doc` ? `Which foundational document is this?` : `Which term matches this description?`; }
function buildQuiz(){
  const pool = shuffleArr(deckCards(Q.deck).slice()).slice(0, Q.count);
  Q.items = pool.map(c=>{
    const fam = familyOf(c);
    let cands = CARDS.filter(x=>x.id!==c.id && familyOf(x)===fam);
    const sameUnit = cands.filter(x=>x.u===c.u);
    let picks = shuffleArr(fam===`concept` && sameUnit.length>=3 ? sameUnit.slice() : cands.slice()).slice(0,3);
    return { id:c.id, options: shuffleArr([c.id, ...picks.map(p=>p.id)]), result:null, chosen:null };
  });
  Q.i=0; Q.score=0; Q.answered=false; Q.phase = Q.items.length ? `question` : `setup`;
}
function stopTick(){ if(Q.tick){ clearInterval(Q.tick); Q.tick=null; } }
function renderQuiz(focusDeck){
  stopTick();
  const el=$(`#view-quiz`);
  if(Q.phase===`setup`){
    const avail = deckCards(Q.deck).length;
    el.innerHTML = `<div class="stack">
      <div><h2>Quiz me</h2><p class="lede">Multiple choice, like Section I of the exam. Each question gives a description; pick the matching term, case, or document from four choices. Missed cards go to the Still learning deck.</p></div>
      <div class="panel stack">
        <div><span class="lbl" id="quiz-deck-lbl">Deck</span>${chipsHTML(Q.deck,`quiz`)}</div>
        <fieldset><legend class="lbl">Questions</legend><div class="pills">
          ${[10,20,30].map(n=>`<label class="pill" for="qn-${n}"><input type="radio" name="qn" id="qn-${n}" value="${n}" ${Q.count===n?`checked`:``}><span>${n}</span></label>`).join(``)}
        </div></fieldset>
        <fieldset><legend class="lbl">Timer per question</legend><div class="pills">
          ${TIMERS.map(t=>`<label class="pill" for="qt-${t.v}"><input type="radio" name="qt" id="qt-${t.v}" value="${t.v}" ${Q.timer===t.v?`checked`:``}><span>${t.label}</span></label>`).join(``)}
        </div>
        <p class="note">AP pace is 80 minutes ÷ 55 questions. The longer settings match the extended-time accommodations the College Board commonly approves (time and a half, double time), so students who use them can practice at their real pace.</p></fieldset>
        <div class="row-btns"><button type="button" class="btn primary" id="quiz-start" ${avail?``:`disabled`}>Start ${Math.min(Q.count,avail)}-question quiz</button></div>
      </div></div>`;
    el.querySelectorAll(`.chip`).forEach(b=>b.addEventListener(`click`,()=>{ Q.deck=b.dataset.deck; renderQuiz(b.dataset.deck); }));
    el.querySelectorAll(`input[name="qn"]`).forEach(r=>r.addEventListener(`change`,()=>{ Q.count=+r.value; const b=$(`#quiz-start`); b.textContent=`Start ${Math.min(Q.count,deckCards(Q.deck).length)}-question quiz`; }));
    el.querySelectorAll(`input[name="qt"]`).forEach(r=>r.addEventListener(`change`,()=>{ Q.timer=+r.value; }));
    $(`#quiz-start`).addEventListener(`click`,()=>{ buildQuiz(); renderQuiz(); });
    if(focusDeck){ const f=el.querySelector(`.chip[data-deck="${focusDeck}"]`); if(f) f.focus(); }
    return;
  }
  if(Q.phase===`question`){ renderQuestion(); return; }
  renderQuizResults();
}
function renderQuestion(){
  const el=$(`#view-quiz`); const it=Q.items[Q.i]; const c=BY_ID[it.id];
  if(!Q.answered && Q.timer){ Q.deadline = Date.now()+Q.timer*1000; }
  el.innerHTML = `<div class="qhead"><span class="tnum">Question ${Q.i+1} of ${Q.items.length}</span><span class="muted tnum">Score ${Q.score}</span></div>
    ${Q.timer?`<div class="timer" id="timer"><div class="track"><div class="fill" id="timer-fill" style="width:100%"></div></div><span class="tnum" id="timer-txt">${Q.timer} s</span></div>`:``}
    <div class="sheet" id="qsheet" tabindex="-1">
      <div class="card-top"><span>${esc(eyebrow(c))}</span><span class="cardno">${esc(badgeText(c)||`Concept`)}</span></div>
      <p class="prompt">${promptFor(c)}</p>
      <p class="clue">${esc(c.clue||c.b)}</p>
    </div>
    <ol class="options" id="options">${it.options.map((oid,k)=>`<li><button type="button" class="btn opt" data-k="${k}"><kbd>${k+1}</kbd><span>${esc(BY_ID[oid].f)}</span><span class="mark"></span></button></li>`).join(``)}</ol>
    <div class="feedback" id="feedback" aria-live="polite"></div>`;
  el.querySelectorAll(`.opt`).forEach(b=>b.addEventListener(`click`,()=>choose(+b.dataset.k)));
  $(`#qsheet`).focus({preventScroll:true});
  if(Q.timer){
    Q.tick=setInterval(()=>{
      const left=Math.max(0,Q.deadline-Date.now()); const frac=left/(Q.timer*1000);
      const fill=$(`#timer-fill`), txt=$(`#timer-txt`), box=$(`#timer`);
      if(fill) fill.style.width=(frac*100)+`%`;
      if(txt) txt.textContent=Math.ceil(left/1000)+` s`;
      if(box) box.classList.toggle(`low`, frac<0.2);
      if(left<=0){ stopTick(); choose(-1); }
    },250);
  }
}
function choose(k){
  if(Q.answered || Q.phase!==`question`) return;
  stopTick(); Q.answered=true;
  const it=Q.items[Q.i]; const c=BY_ID[it.id];
  const chosenId = k>=0 ? it.options[k] : null;
  it.chosen=chosenId;
  it.result = chosenId===c.id ? `correct` : (k<0 ? `timeout` : `wrong`);
  if(it.result===`correct`) Q.score++; else { store.status[c.id]=`learning`; save(); }
  $$(`#options .opt`).forEach((b,idx)=>{
    b.disabled=true;
    const oid=it.options[idx];
    if(oid===c.id){ b.classList.add(`correct`); b.querySelector(`.mark`).innerHTML=`<span class="icon good" aria-hidden="true">✓</span>Answer`; }
    else if(oid===chosenId){ b.classList.add(`wrong`); b.querySelector(`.mark`).innerHTML=`<span class="icon bad" aria-hidden="true">✕</span>Your pick`; }
  });
  const verdict = it.result===`correct`
    ? `<p class="verdict"><span class="icon good" aria-hidden="true">✓</span>Correct.</p>`
    : it.result===`timeout`
      ? `<p class="verdict"><span class="icon warn" aria-hidden="true">!</span>Time’s up. The answer is ${esc(c.f)}.</p>`
      : `<p class="verdict"><span class="icon bad" aria-hidden="true">✕</span>Not quite. The answer is ${esc(c.f)}.</p>`;
  const last = Q.i>=Q.items.length-1;
  $(`#feedback`).innerHTML = `${verdict}${c.why?`<p class="note" style="margin-top:0">${esc(c.why)}</p>`:``}
    <div class="row-btns"><button type="button" class="btn primary" id="next-q">${last?`See results`:`Next question`} <kbd>Enter</kbd></button></div>`;
  $(`#next-q`).addEventListener(`click`, nextQ);
  $(`#next-q`).focus({preventScroll:true});
  $(`.qhead .muted`).textContent=`Score ${Q.score}`;
}
function nextQ(){
  if(!Q.answered) return;
  if(Q.i<Q.items.length-1){ Q.i++; Q.answered=false; renderQuestion(); }
  else { Q.phase=`done`; logSession(`quiz`, Q.deck, Q.items.map(it=>({id:it.id, pts:it.result===`correct`?2:0}))); renderQuizResults(); }
}
function unitBreakdown(rows){
  const by={}; rows.forEach(r=>{ const u=BY_ID[r.id].u; by[u]=by[u]||{got:0,max:0}; by[u].got+=r.pts; by[u].max+=2; });
  return Object.keys(by).sort().map(u=>({u:+u, got:by[u].got, max:by[u].max, p:pct(by[u].got,by[u].max)}));
}
function barsHTML(rows){
  return `<ul class="bars">${rows.map(r=>`<li class="bar-row"><span>Unit ${r.u} · ${esc(UNITS[r.u].short)}</span>
    <span class="bar-cell" title="Unit ${r.u}: ${r.p}%"><span class="bar-fill" style="width:calc((100% - 3.5rem) * ${r.p/100})"></span><span class="bar-val">${r.p}%</span></span></li>`).join(``)}</ul>`;
}
function renderQuizResults(){
  const el=$(`#view-quiz`);
  const rows=Q.items.map(it=>({id:it.id, pts:it.result===`correct`?2:0}));
  const missed=Q.items.filter(it=>it.result!==`correct`);
  el.innerHTML = `<div class="stack">
    <div class="panel stack">
      <span class="lbl">Quiz results · ${esc(deckOf(Q.deck).label)}</span>
      <div class="hero-row"><span class="hero">${pct(Q.score,Q.items.length)}%</span><span class="muted">${Q.score} of ${Q.items.length} correct</span></div>
      <div><span class="lbl">By unit</span>${barsHTML(unitBreakdown(rows))}</div>
    </div>
    ${missed.length?`<div class="panel stack"><h3>Review these</h3><ul class="missed">${missed.map(it=>`<li><span>${esc(BY_ID[it.id].f)}</span><span class="tag"><span class="dot ${it.result===`timeout`?`warn-bg`:``}" style="${it.result===`timeout`?``:`background:var(--bad)`}" aria-hidden="true"></span>${it.result===`timeout`?`Out of time`:`Missed`}</span></li>`).join(``)}</ul>
      <p class="note" style="margin-top:0">These are now in the Still learning deck.</p></div>`:``}
    <div class="row-btns">
      ${missed.length?`<button type="button" class="btn primary" id="study-missed">Study the ones I missed</button>`:``}
      <button type="button" class="btn" id="quiz-again">New quiz</button>
    </div></div>`;
  const sm=$(`#study-missed`); if(sm) sm.addEventListener(`click`,()=>{ S.deck=`learning`; buildQueue(); location.hash=`study`; });

/* ---------------------------------------------------------------
   PARENT MODE
---------------------------------------------------------------- */
const P = { phase:`setup`, deck:`all`, count:10, items:[], i:0, ratings:[], revealed:false };
function askText(c){
  if(c.ask) return c.ask;
  if(c.t===`case`) return `What happened in ${c.f}, and what did the Court decide?`;
  if(c.t===`doc`) return `What is the main argument or purpose of ${c.f}?`;
  if(/ vs\. /.test(c.f)) return `Explain the difference: ${c.f}.`;
  return `What is “${c.f},” and why does it matter?`;
}
function historyHTML(){
  const list=store.sessions.slice(0,8);

function renderParent(focusDeck){

function renderAsk(){

function rateParent(r){
  const id=P.items[P.i];

  store.status[id] = r===2 ? `known` : `learning`; save();

function finishParent(){ logSession(`parent`, P.deck, P.ratings); P.phase=`done`; renderParent(); }
function logSession(kind, deck, rows){

    </div>
    <div class="panel stack">
      <h3>${weak.length?`Review together`:`Nothing to review`}</h3>
      ${weak.length?`<ul class="missed">${weak.map(r=>`<li><span>${esc(BY_ID[r.id].f)}</span><span class="tag"><span class="icon ${r.pts===1?`warn`:`bad`}" style="width:1rem;height:1rem;font-size:.6rem" aria-hidden="true">${r.pts===1?`~`:`✕`}</span>${r.pts===1?`Partly`:`Missed`}</span></li>`).join(``)}</ul>
      <p class="note" style="margin-top:0">These cards are now in the Still learning deck, so they’ll come up first the next time your student studies.</p>`:`<p class="lede" style="margin-top:0">Every answer was solid. Try a harder deck next time, like Required cases.</p>`}
      <div class="row-btns">
        <button type="button" class="btn primary" id="copy-report">Copy report</button>
        ${weak.length?`<button type="button" class="btn" id="study-weak">Send weak cards to Study</button>`:``}
        <button type="button" class="btn" id="parent-again">Start another check-in</button>
      </div>
      <div id="copy-fallback" hidden><label class="lbl" for="report-text">Select all and copy</label><textarea id="report-text" rows="9" readonly></textarea></div>
    </div></div>`;
  $(`#copy-report`).addEventListener(`click`, async e=>{
    const txt=reportText(); const btn=e.currentTarget;
    try{ await navigator.clipboard.writeText(txt); btn.textContent=`Copied`; announce(`Report copied.`); setTimeout(()=>{ if(document.body.contains(btn)) btn.textContent=`Copy report`; },2500); }
    catch(err){ const fb=$(`#copy-fallback`); fb.hidden=false; const ta=$(`#report-text`); ta.value=txt; ta.focus(); ta.select(); announce(`Copying isn’t allowed here. The report text is selected below.`); }
  });
  const sw=$(`#study-weak`); if(sw) sw.addEventListener(`click`,()=>{ S.deck=`learning`; buildQueue(); location.hash=`study`; });
  $(`#parent-again`).addEventListener(`click`,()=>{ P.phase=`setup`; renderParent(); });
}

/* ---------------------------------------------------------------
   EXAM GUIDE
---------------------------------------------------------------- */
function openCard(id){
  const c=BY_ID[id]; S.deck = c.t===`case`?`cases`:c.t===`doc`?`docs`:`u${c.u}`;
  S.shuffle=false; buildQueue(); S.pos=Math.max(0,S.queue.indexOf(id)); location.hash=`study`;
}
function renderGuide(){
  const el=$(`#view-guide`);
  const cases=CARDS.filter(c=>c.t===`case`).slice().sort((a,b)=>(+a.f.match(/\((\d{4})\)/)[1])-(+b.f.match(/\((\d{4})\)/)[1]));

  const MAX=50;
  el.innerHTML = `<div class="guide">

    <div class="panel stack"><h3>The exam at a glance</h3>
      <div class="tbl-wrap"><table>

      <p class="note" style="margin-top:0">Each bar shows the range of Section I questions that come from that unit.</p>
      <div class="rng-chart">
        ${[1,2,3,4,5].map(u=>{ const [lo,hi]=UNITS[u].w; return `<div class="rng-row"><span>Unit ${u} · ${esc(UNITS[u].short)}</span>
          <span class="rng-track"><span class="rng" tabindex="0" style="left:${lo/MAX*100}%;width:${(hi-lo)/MAX*100}%" aria-label="Unit ${u}, ${esc(UNITS[u].name)}: ${lo} to ${hi} percent"><span class="tip">Unit ${u}: ${lo}–${hi}% of Section I</span></span>
          <span class="rng-lab" style="left:calc(${hi/MAX*100}% + .4rem)">${lo}–${hi}%</span></span></div>`; }).join(``)}
        <div class="rng-axis" aria-hidden="true"><span></span><span class="ticks"><span>0%</span><span>10%</span><span>20%</span><span>30%</span><span>40%</span><span>50%</span></span></div>
      </div>
      <p class="lede" style="margin-top:0">Units 2 and 5 together are 45–63% of the multiple-choice section, so put study time there first.</p>

    <div class="panel stack"><h3>The four free-response questions</h3>

        <li><span class="nm">1 · Concept Application <span class="muted">· about 20 min</span></span><span>A short political scenario. Explain how it connects to a principle, institution, or process, and how another branch or actor could respond.</span><span class="note" style="margin-top:0">Practice with: checks and balances, federalism, and Congress–president cards.</span></li>
        <li><span class="nm">2 · Quantitative Analysis <span class="muted">· about 20 min</span></span><span>A chart, table, or map. Describe the data, find a trend, draw a conclusion, and connect it to a political concept.</span><span class="note" style="margin-top:0">Practice with: polling, turnout, and budget cards.</span></li>
        <li><span class="nm">3 · SCOTUS Comparison <span class="muted">· about 20 min</span></span><span>A case you haven’t studied is described. Compare it to one of the 14 required cases and explain how the earlier ruling applies.</span><span class="note" style="margin-top:0">Practice with: the Required cases deck. Know each case’s facts, clause, and holding.</span></li>
        <li><span class="nm">4 · Argument Essay <span class="muted">· about 40 min</span></span><span>Take a defensible position, support it with at least two pieces of evidence (one from the foundational documents listed in the prompt), and respond to an opposing view.</span><span class="note" style="margin-top:0">Practice with: the Foundational docs deck. Have two documents ready for each big theme.</span></li>
      </ul>

      <p class="note" style="margin-top:0">Roe v. Wade was removed from the required list after Dobbs (2022). It’s in the deck as a context card.</p>
      <ul class="reqlist">${cases.map(c=>`<li><button type="button" data-open="${c.id}"><span class="nm">${esc(c.f)}</span><span class="go">Open card →</span><span class="ln">${esc(c.clue)}</span></button></li>`).join(``)}</ul>

  </div>`;
  el.querySelectorAll(`[data-open]`).forEach(b=>b.addEventListener(`click`,()=>openCard(b.dataset.open)));
}

/* ---------------------------------------------------------------
   Routing + keyboard
---------------------------------------------------------------- */
const VIEWS=[`study`,`quiz`,`parent`,`guide`];
function route(){
  const h=(location.hash||``).slice(1);
  const v=VIEWS.includes(h)?h:`study`;
  if(S.view===`quiz` && v!==`quiz`) stopTick();
  S.view=v;
  VIEWS.forEach(x=>{ $(`#view-`+x).hidden = x!==v; });
  $$(`.tabs a`).forEach(a=>{ if(a.dataset.view===v) a.setAttribute(`aria-current`,`page`); else a.removeAttribute(`aria-current`); });
  if(v===`study`) renderStudy();
  else if(v===`quiz`){ if(Q.phase===`question` && Q.answered){ nextQ(); } else renderQuiz(); }
  else if(v===`parent`) renderParent();
  else renderGuide();
}
window.addEventListener(`hashchange`, ()=>{ route(); window.scrollTo({top:0}); });

document.addEventListener(`keydown`, e=>{
  if(e.altKey||e.ctrlKey||e.metaKey) return;
  const tag=(e.target.tagName||``).toLowerCase();
  if([`input`,`select`,`textarea`].includes(tag)) return;
  const onControl = tag===`button` || tag===`a`;
  if(S.view===`study` && !S.done && $(`#card`)){
    if((e.key===` `||e.key===`Enter`) && !onControl){ e.preventDefault(); flip(); }
    else if(e.key===`ArrowRight`){ e.preventDefault(); go(1); }
    else if(e.key===`ArrowLeft`){ e.preventDefault(); go(-1); }
    else if(e.key===`1`){ rate(`learning`); }
    else if(e.key===`2`){ rate(`known`); }
  } else if(S.view===`quiz` && Q.phase===`question`){
    if(!Q.answered && [`1`,`2`,`3`,`4`].includes(e.key)){ e.preventDefault(); choose(+e.key-1); }
    else if(Q.answered && e.key===`Enter` && !onControl){ e.preventDefault(); nextQ(); }
  }
});

/* ---------------------------------------------------------------
   Boot (keeps the viewer's place across a republish)
---------------------------------------------------------------- */
function start(data){
  if(data && Array.isArray(data.queue) && data.queue.every(id=>BY_ID[id])){
    S.deck = DECKS.some(d=>d.key===data.deck) ? data.deck : `all`;
    S.queue = data.queue; S.pos = Math.min(data.pos||0, Math.max(0,data.queue.length-1)); S.shuffle=!!data.shuffle;
  }
  applyPrefs();
  route();
}
if(window.claude && window.claude.hot && window.claude.hot.snapshot){
  window.claude.hot.snapshot(()=>({deck:S.deck, queue:S.queue, pos:S.pos, shuffle:S.shuffle}));
}
if(window.claude && window.claude.hot && window.claude.hot.ready){ window.claude.hot.ready(start); }
else { start((window.claude && window.claude.hot && window.claude.hot.data) || {}); }
</script>
